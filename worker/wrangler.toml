name = "medar-api"
main = "index.ts"
compatibility_date = "2026-10-16"

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
MEDAR_MODE = "public-demo"
ALLOWED_ORIGINS = "https://ehsanamn1.github.io,capacitor://localhost,https://localhost,ionic://localhost,http://localhost,http://localhost:5173,http://127.0.0.1:5173"

[[r2_buckets]]
binding = "FILE_STORE"
bucket_name = "medar-private-files"

[triggers]
crons = ["30 1 * * *"]
