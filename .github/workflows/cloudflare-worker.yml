name: Deploy Medar to Cloudflare Workers
on:
  # Production deployment: Cloudflare Worker API + frontend assets backed by Neon.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'worker/**'
      - 'public/**'
      - 'scripts/**'
      - 'e2e/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/cloudflare-worker.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MEDAR_DATABASE_URL: ${{ secrets.MEDAR_DATABASE_URL }}
      MEDAR_ALLOWED_ORIGINS: ${{ vars.MEDAR_ALLOWED_ORIGINS }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MEDAR_AI_ENCRYPTION_KEY: ${{ secrets.MEDAR_AI_ENCRYPTION_KEY }}
      MEDAR_VAPID_PUBLIC_KEY: ${{ secrets.MEDAR_VAPID_PUBLIC_KEY }}
      MEDAR_VAPID_PRIVATE_KEY: ${{ secrets.MEDAR_VAPID_PRIVATE_KEY }}
      MEDAR_VAPID_SUBJECT: ${{ secrets.MEDAR_VAPID_SUBJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Validate deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$MEDAR_DATABASE_URL" || { echo "MEDAR_DATABASE_URL is missing"; exit 1; }
      - name: Enforce explicit runtime mode for each Worker deployment
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^[[:space:]]*MEDAR_MODE[[:space:]]*=' worker/wrangler.toml; then
            echo "worker/wrangler.toml must not set MEDAR_MODE globally; the operational and demo Worker deployments set it explicitly."
            exit 1
          fi
          grep -Fq -- '--name medar-ops --var MEDAR_MODE:public-demo' .github/workflows/cloudflare-worker.yml
          grep -Fq -- 'args=(--name medar-ops --var MEDAR_MODE:operational)' .github/workflows/cloudflare-worker.yml
          grep -Fq -- '--name medar-api --var MEDAR_MODE:public-demo' .github/workflows/cloudflare-worker.yml
          echo "Bootstrap, operational, and compatibility Worker modes are explicit and cannot inherit a conflicting global mode."
      - name: Verify the established Medar schema before migration
        shell: bash
        run: |
          schema_ready="$(psql "$MEDAR_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "select (to_regclass('public.medar_users') is not null and to_regclass('public.medar_sessions') is not null and to_regclass('public.companies') is not null and to_regclass('public.memberships') is not null and to_regclass('public.orders') is not null)")"
          if [[ "$schema_ready" != "t" ]]; then
            echo "MEDAR_DATABASE_URL must point to the existing Medar migration branch. Refusing to replay initial schema on a different or empty database."
            exit 1
          fi
      - name: Apply versioned compatibility migrations to Neon
        shell: bash
        run: |
          psql "$MEDAR_DATABASE_URL" -v ON_ERROR_STOP=1 -c "create table if not exists public.medar_schema_migrations (version text primary key, checksum text not null, applied_at timestamptz not null default now())"
          for migration in worker/migrations/0007_existing_medar_schema_compat.sql worker/migrations/0008_operational_task_actions.sql worker/migrations/0009_inventory_movement_concurrency_lock.sql worker/migrations/0010_purchase_order_lifecycle.sql worker/migrations/0011_username_password_only.sql worker/migrations/0012_client_presence.sql worker/migrations/0013_ai_assistant_and_contacts.sql worker/migrations/0014_contact_intelligence.sql worker/migrations/0015_ai_action_approval_ledger.sql worker/migrations/0016_membership_module_permissions.sql worker/migrations/0017_delivery_video_evidence.sql worker/migrations/0018_bank_reconciliation_ledger.sql worker/migrations/0019_daily_briefing_notifications.sql worker/migrations/0020_operational_event_exception_ledger.sql worker/migrations/0021_medar_connect_messaging.sql worker/migrations/0022_web_push_delivery_queue.sql worker/migrations/0023_operational_event_hooks.sql worker/migrations/0024_connect_task_notifications.sql worker/migrations/0025_supplier_location_details.sql worker/migrations/0026_task_status_notifications.sql worker/migrations/0027_capacity_evidence_review.sql worker/migrations/0028_capacity_evidence_storage_bucket.sql worker/migrations/0029_medar_private_file_database_fallback.sql worker/migrations/0030_member_account_role_constraints.sql worker/migrations/0031_member_provisioning_schema_guard.sql; do
            version="$(basename "$migration")"
            checksum="$(sha256sum "$migration" | awk '{print $1}')"
            applied="$(psql "$MEDAR_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "select checksum from public.medar_schema_migrations where version = '$version'")"
            if [ -n "$applied" ]; then
              if [ "$applied" != "$checksum" ]; then
                echo "Migration checksum mismatch for $version. Applied migrations must not be edited in place."
                exit 1
              fi
              echo "Skipping already-applied migration $version"
              continue
            fi
            echo "Applying $version"
            psql "$MEDAR_DATABASE_URL" -v ON_ERROR_STOP=1 -1 -f "$migration"
            psql "$MEDAR_DATABASE_URL" -v ON_ERROR_STOP=1 -c "insert into public.medar_schema_migrations(version,checksum) values ('$version','$checksum')"
          done
      - name: Verify member account provisioning schema contract
        shell: bash
        run: |
          contract_ready="$(psql "$MEDAR_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            select (
              (select is_nullable = 'YES' from information_schema.columns where table_schema='public' and table_name='medar_users' and column_name='phone_e164') and
              (select is_nullable = 'YES' from information_schema.columns where table_schema='public' and table_name='profiles' and column_name='phone') and
              (select count(*) = 1 from information_schema.columns where table_schema='public' and table_name='medar_users' and column_name='username_normalized') and
              exists (
                select 1 from pg_constraint
                where conrelid = 'public.medar_users'::regclass
                  and conname = 'medar_users_requested_role_check'
                  and pg_get_constraintdef(oid) like '%admin%'
              )
            )")"
          if [[ "$contract_ready" != "t" ]]; then
            echo "Member provisioning schema contract is not satisfied after migrations."
            exit 1
          fi
      - name: Verify required Medar RPCs and migration ledger
        shell: bash
        run: |
          readiness="$(psql "$MEDAR_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            select (
              to_regclass('public.medar_users') is not null and
              to_regclass('public.medar_client_presence') is not null and
              to_regclass('public.medar_ai_provider_configs') is not null and
              to_regclass('public.medar_ai_usage_log') is not null and
              to_regclass('public.medar_ai_action_runs') is not null and
              to_regprocedure('public.medar_execute_ai_create_task(uuid,uuid,uuid)') is not null and
              to_regclass('public.medar_membership_module_permissions') is not null and
              to_regclass('public.medar_bank_accounts') is not null and
              to_regclass('public.medar_bank_transactions') is not null and
              to_regclass('public.notifications') is not null and
              (select count(*) from information_schema.columns where table_schema='public' and table_name='notifications' and column_name='dedupe_key') = 1 and
              exists (select 1 from pg_indexes where schemaname='public' and indexname='notifications_company_user_dedupe_key_uq') and
              exists (select 1 from public.medar_schema_migrations where version='0019_daily_briefing_notifications.sql') and
              to_regclass('public.medar_operational_events') is not null and
              to_regclass('public.medar_exception_cases') is not null and
              to_regclass('public.medar_conversations') is not null and
              to_regclass('public.medar_conversation_participants') is not null and
              to_regclass('public.medar_messages') is not null and
              to_regclass('public.medar_push_subscriptions') is not null and
              to_regclass('public.medar_notification_outbox') is not null and
              to_regprocedure('public.medar_notify_task_status_change()') is not null and
              exists (select 1 from public.medar_schema_migrations where version='0025_supplier_location_details.sql') and
              exists (select 1 from public.medar_schema_migrations where version='0027_capacity_evidence_review.sql') and
              exists (select 1 from public.medar_schema_migrations where version='0028_capacity_evidence_storage_bucket.sql') and
              exists (select 1 from public.medar_schema_migrations where version='0029_medar_private_file_database_fallback.sql') and
              exists (select 1 from public.medar_schema_migrations where version='0030_member_account_role_constraints.sql') and
              exists (select 1 from pg_constraint where conrelid='public.medar_users'::regclass and conname='medar_users_requested_role_check' and pg_get_constraintdef(oid) like '%admin%') and
              exists (select 1 from information_schema.columns where table_schema='public' and table_name='medar_files' and column_name='content_base64') and
              exists (select 1 from pg_constraint where conrelid='public.medar_files'::regclass and conname='medar_files_bucket_id_check' and pg_get_constraintdef(oid) like '%capacity-evidence%') and
              (select count(*) from information_schema.columns where table_schema='public' and table_name='capacity_commitments' and column_name in ('evidence_path','evidence_name','evidence_mime_type','evidence_uploaded_at','evidence_review_status','evidence_reviewed_by','evidence_reviewed_at','evidence_review_note')) = 8 and
              (select count(*) from information_schema.columns where table_schema='public' and table_name='suppliers' and column_name in ('province','address','latitude','longitude')) = 4 and
              to_regprocedure('public.medar_enqueue_notification_push()') is not null and
              to_regprocedure('public.medar_emit_operational_event()') is not null and
              exists (select 1 from pg_trigger where tgname='medar_emit_operational_event' and not tgisinternal) and
              exists (select 1 from public.medar_schema_migrations where version='0023_operational_event_hooks.sql') and
              to_regprocedure('public.medar_notify_task_assignee()') is not null and
              to_regprocedure('public.medar_notify_conversation_participants()') is not null and
              exists (select 1 from pg_trigger where tgname='medar_notify_task_assignee' and not tgisinternal) and
              exists (select 1 from pg_trigger where tgname='medar_notify_conversation_participants' and not tgisinternal) and
              exists (select 1 from public.medar_schema_migrations where version='0024_connect_task_notifications.sql') and
              exists (select 1 from public.medar_schema_migrations where version='0022_web_push_delivery_queue.sql') and
              exists (select 1 from public.medar_schema_migrations where version='0020_operational_event_exception_ledger.sql') and
              exists (select 1 from public.medar_schema_migrations where version='0021_medar_connect_messaging.sql') and
              exists (select 1 from public.medar_schema_migrations where version = '0018_bank_reconciliation_ledger.sql') and
              exists (select 1 from pg_enum e join pg_type t on t.oid=e.enumtypid join pg_namespace n on n.oid=t.typnamespace where n.nspname='public' and t.typname='evidence_kind' and e.enumlabel='video') and
              to_regprocedure('public.medar_check_membership_permission_company()') is not null and
              exists (select 1 from public.medar_schema_migrations where version = '0016_membership_module_permissions.sql') and
              exists (select 1 from public.medar_schema_migrations where version = '0015_ai_action_approval_ledger.sql') and
              (select count(*) from information_schema.columns where table_schema='public' and table_name in ('customers','suppliers') and column_name in ('email','organization_name','contact_notes','contact_tags','contact_source')) = 10 and
              to_regclass('public.medar_sessions') is not null and
              to_regclass('public.medar_rate_limits') is not null and
              to_regclass('public.medar_audit_log') is not null and
              to_regclass('public.company_invites') is not null and
              to_regclass('public.medar_files') is not null and
              to_regclass('public.purchase_orders') is not null and
              to_regclass('public.purchase_order_items') is not null and
              to_regprocedure('public.medar_allocate_order_item(uuid,uuid,uuid,uuid)') is not null and
              to_regprocedure('public.medar_record_inventory_movement(uuid,uuid,uuid,text,numeric,numeric,uuid,uuid,uuid,text,text)') is not null and
              position('pg_advisory_xact_lock' in pg_get_functiondef(to_regprocedure('public.medar_record_inventory_movement(uuid,uuid,uuid,text,numeric,numeric,uuid,uuid,uuid,text,text)'))) > 0 and
              to_regprocedure('public.medar_record_quality_review(uuid,uuid,uuid,text,text,jsonb)') is not null and
              to_regprocedure('public.medar_start_operational_task(uuid,uuid)') is not null and
              to_regprocedure('public.medar_submit_operational_task(uuid,uuid,text)') is not null and
              to_regprocedure('public.medar_review_operational_task(uuid,uuid,text,text)') is not null and
              to_regprocedure('public.medar_create_partner_settlement_period(uuid,uuid,date,date)') is not null and
              to_regprocedure('public.medar_refresh_partner_settlement_period(uuid,uuid)') is not null and
              to_regprocedure('public.medar_approve_partner_settlement_period(uuid,uuid)') is not null and
              to_regprocedure('public.medar_record_partner_settlement_payment(uuid,uuid,numeric,text,timestamptz)') is not null and
              to_regprocedure('public.medar_create_purchase_order(uuid,uuid,uuid,text,jsonb,date,text)') is not null and
              to_regprocedure('public.medar_approve_purchase_order(uuid,uuid,uuid)') is not null and
              to_regprocedure('public.medar_receive_purchase_order(uuid,uuid,uuid,jsonb,text,text)') is not null and
              (select count(*) from public.medar_schema_migrations where version in ('0007_existing_medar_schema_compat.sql','0008_operational_task_actions.sql','0009_inventory_movement_concurrency_lock.sql','0010_purchase_order_lifecycle.sql','0011_username_password_only.sql','0012_client_presence.sql')) = 6
            )
          ")"
          if [[ "$readiness" != "t" ]]; then
            echo "Neon schema is missing a required table, versioned migration, or Worker RPC. Refusing deployment."
            exit 1
          fi
      - name: Verify private file storage fallback is ready
        shell: bash
        run: |
          psql "$MEDAR_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "select exists(select 1 from information_schema.columns where table_schema='public' and table_name='medar_files' and column_name='content_base64')" | grep -Fxq t
      # Keep medar-api as the public showcase. The operational app is a separate Worker
      # so enabling its sign-in UI never changes the read-only public demo.
      - name: Build safe bootstrap bundle for the operational Worker
        run: npm run build
        env:
          VITE_ENABLE_AUTH_UI: 'false'
      - name: Verify safe bootstrap bundle before attaching the production database
        shell: bash
        run: |
          test -f dist/index.html
          grep -q 'id="root"' dist/index.html
          grep -Rqs --include='*.js' 'demo-workspace' dist/assets
          grep -Rqs --include='*.js' 'دموی قابل ارائه' dist/assets
          echo "Bootstrap bundle stays in the read-only showcase mode while the operational database secret is attached."
      - name: Create operational Worker script in safe bootstrap mode
        working-directory: worker
        run: set -o pipefail; npx wrangler@4 deploy --name medar-ops --var MEDAR_MODE:public-demo 2>&1 | tee /tmp/medar-ops-bootstrap.log
      - name: Configure Neon database secret for the operational Worker
        working-directory: worker
        shell: bash
        run: printf '%s' "$MEDAR_DATABASE_URL" | npx wrangler@4 secret put DATABASE_URL --name medar-ops
      - name: Configure a stable dedicated AI encryption key
        working-directory: worker
        shell: bash
        env:
          MEDAR_AI_ENCRYPTION_KEY: ${{ secrets.MEDAR_AI_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "$MEDAR_AI_ENCRYPTION_KEY" ]]; then
            printf '%s' "$MEDAR_AI_ENCRYPTION_KEY" | npx wrangler@4 secret put AI_ENCRYPTION_KEY --name medar-ops
            echo "Dedicated AI encryption key configured from repository secret."
          else
            existing="$(npx wrangler@4 secret list --name medar-ops)"
            if grep -q 'AI_ENCRYPTION_KEY' <<< "$existing"; then
              echo "Existing AI encryption key preserved."
            else
              umask 077
              node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          writeFileSync(process.env.RUNNER_TEMP + '/medar-ai-encryption-key', randomBytes(32).toString('base64url'), { mode: 0o600 });
          NODE
              encryption_key="$(cat "$RUNNER_TEMP/medar-ai-encryption-key")"
              echo "::add-mask::$encryption_key"
              printf '%s' "$encryption_key" | npx wrangler@4 secret put AI_ENCRYPTION_KEY --name medar-ops
              rm -f "$RUNNER_TEMP/medar-ai-encryption-key"
              echo "A stable random AI encryption key was generated and stored as a Worker secret."
            fi
          fi
      - name: Configure Web Push credentials for the operational Worker
        working-directory: worker
        shell: bash
        env:
          MEDAR_VAPID_PUBLIC_KEY: ${{ secrets.MEDAR_VAPID_PUBLIC_KEY }}
          MEDAR_VAPID_PRIVATE_KEY: ${{ secrets.MEDAR_VAPID_PRIVATE_KEY }}
          MEDAR_VAPID_SUBJECT: ${{ secrets.MEDAR_VAPID_SUBJECT }}
        run: |
          set -euo pipefail
          if [[ -n "$MEDAR_VAPID_PUBLIC_KEY" || -n "$MEDAR_VAPID_PRIVATE_KEY" || -n "$MEDAR_VAPID_SUBJECT" ]]; then
            test -n "$MEDAR_VAPID_PUBLIC_KEY" || { echo "MEDAR_VAPID_PUBLIC_KEY is required when configuring Web Push"; exit 1; }
            test -n "$MEDAR_VAPID_PRIVATE_KEY" || { echo "MEDAR_VAPID_PRIVATE_KEY is required when configuring Web Push"; exit 1; }
            test -n "$MEDAR_VAPID_SUBJECT" || { echo "MEDAR_VAPID_SUBJECT is required when configuring Web Push"; exit 1; }
            printf '%s' "$MEDAR_VAPID_PUBLIC_KEY" | npx wrangler@4 secret put VAPID_PUBLIC_KEY --name medar-ops
            printf '%s' "$MEDAR_VAPID_PRIVATE_KEY" | npx wrangler@4 secret put VAPID_PRIVATE_KEY --name medar-ops
            printf '%s' "$MEDAR_VAPID_SUBJECT" | npx wrangler@4 secret put VAPID_SUBJECT --name medar-ops
            echo "Web Push credentials configured from repository secrets."
          else
            existing="$(npx wrangler@4 secret list --name medar-ops)"
            has_public=0; has_private=0; has_subject=0
            grep -q 'VAPID_PUBLIC_KEY' <<< "$existing" && has_public=1 || true
            grep -q 'VAPID_PRIVATE_KEY' <<< "$existing" && has_private=1 || true
            grep -q 'VAPID_SUBJECT' <<< "$existing" && has_subject=1 || true
            if [[ "$has_public$has_private$has_subject" == "111" ]]; then
              echo "Existing Web Push credentials are preserved."
            elif [[ "$has_public$has_private$has_subject" != "000" ]]; then
              echo "Worker has an incomplete VAPID secret set. Configure all three repository secrets or repair the Worker secrets before deployment."
              exit 1
            else
              echo "No VAPID credentials exist; generating a stable key pair for browser Push."
              umask 077
              node --input-type=module <<'NODE'
          import { generateKeyPairSync } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          const { publicKey, privateKey } = generateKeyPairSync('ec', { namedCurve: 'prime256v1' });
          const pub = publicKey.export({ format: 'jwk' });
          const priv = privateKey.export({ format: 'jwk' });
          const point = Buffer.concat([Buffer.from([4]), Buffer.from(pub.x, 'base64url'), Buffer.from(pub.y, 'base64url')]).toString('base64url');
          const directory = process.env.RUNNER_TEMP;
          writeFileSync(directory + '/medar-vapid-public', point, { mode: 0o600 });
          writeFileSync(directory + '/medar-vapid-private', priv.d, { mode: 0o600 });
          writeFileSync(directory + '/medar-vapid-subject', 'https://medar-ops.dengxiao445.workers.dev', { mode: 0o600 });
          NODE
              public_key="$(cat "$RUNNER_TEMP/medar-vapid-public")"
              private_key="$(cat "$RUNNER_TEMP/medar-vapid-private")"
              subject="$(cat "$RUNNER_TEMP/medar-vapid-subject")"
              echo "::add-mask::$private_key"
              printf '%s' "$public_key" | npx wrangler@4 secret put VAPID_PUBLIC_KEY --name medar-ops
              printf '%s' "$private_key" | npx wrangler@4 secret put VAPID_PRIVATE_KEY --name medar-ops
              printf '%s' "$subject" | npx wrangler@4 secret put VAPID_SUBJECT --name medar-ops
              rm -f "$RUNNER_TEMP/medar-vapid-public" "$RUNNER_TEMP/medar-vapid-private" "$RUNNER_TEMP/medar-vapid-subject"
              echo "A persistent VAPID key pair is configured for browser Push."
            fi
          fi
      - name: Build the protected operational app with sign-in enabled and shared API
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.MEDAR_OPS_API_BASE_URL }}
          VITE_ENABLE_AUTH_UI: 'true'
          VITE_APP_VERSION: ${{ github.sha }}
      - name: Verify the operational bundle includes sign-in and invite-only access
        shell: bash
        env:
          MEDAR_OPS_API_BASE_URL: ${{ vars.MEDAR_OPS_API_BASE_URL }}
          MEDAR_APP_VERSION: ${{ github.sha }}
        run: |
          test -f dist/index.html
          grep -q 'id="root"' dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.css' -print -quit)"
          grep -Rqs --include='*.js' 'simorgh-signin-layer' dist/assets
          grep -Rqs --include='*.js' 'ثبت‌نام عمومی غیرفعال است' dist/assets
          grep -Rqs --include='*.js' 'حداقل ۸ نویسه' dist/assets
          if [[ -n "$MEDAR_OPS_API_BASE_URL" ]]; then
            grep -Rqs --include='*.js' -F "$MEDAR_OPS_API_BASE_URL" dist/assets
            echo "Operational bundle embeds the explicitly configured external API origin."
          else
            echo "Operational bundle uses same-origin /api routes; this is the default for a Worker custom domain."
          fi
          grep -Rqs --include='*.js' -F "$MEDAR_APP_VERSION" dist/assets
          grep -Rqs --include='*.css' 'simorgh-signin-layer' dist/assets
          grep -Rqs --include='*.css' 'signin-form-card' dist/assets
          echo "Operational bundle includes the guarded sign-in and disabled public registration."
      - name: Publish operational Worker with database secret
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          args=(--name medar-ops --var MEDAR_MODE:operational)
          custom_origins="$(printf '%s' "$MEDAR_ALLOWED_ORIGINS" | tr -d '[:space:]')"
          if [[ -n "$custom_origins" ]]; then
            default_origins="https://ehsanamn1.github.io,capacitor://localhost,https://localhost,ionic://localhost,http://localhost,http://localhost:5173,http://127.0.0.1:5173"
            args+=(--var "ALLOWED_ORIGINS:$default_origins,$custom_origins")
            echo "Configuring the Worker to allow configured Raz Sahara frontend origins."
          fi
          npx wrangler@4 deploy "${args[@]}" 2>&1 | tee /tmp/medar-ops-deploy.log
      - name: Verify public registration is blocked and private access remains gated
        shell: bash
        run: |
          worker_url="$(grep -Eo 'https://medar-ops\.[a-z0-9-]+\.workers\.dev' /tmp/medar-ops-deploy.log 2>/dev/null | tail -n1 || true)"
          test -n "$worker_url"
          signup_status="$(curl --silent --show-error --output "$RUNNER_TEMP/medar-public-signup.json" --write-out '%{http_code}' --header 'Origin: https://medar-ops.dengxiao445.workers.dev' --header 'Content-Type: application/json' --data '{"username":"public_signup_probe","password":"NoPublicSignup-123"}' "$worker_url/api/auth/signup")"
          if [[ "$signup_status" != "403" ]]; then echo "Public account creation must be rejected with 403 (received $signup_status)."; cat "$RUNNER_TEMP/medar-public-signup.json"; exit 1; fi
          login_status="$(curl --silent --show-error --output "$RUNNER_TEMP/medar-invalid-login.json" --write-out '%{http_code}' --header 'Origin: https://medar-ops.dengxiao445.workers.dev' --header 'Content-Type: application/json' --data '{"username":"public_signup_probe","password":"NoPublicSignup-123"}' "$worker_url/api/auth/login")"
