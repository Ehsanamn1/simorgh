      - name: Smoke-test the live operational Worker and protected route
        shell: bash
        run: |
          worker_url="$(grep -Eo 'https://medar-ops\.[a-z0-9-]+\.workers\.dev' /tmp/medar-ops-deploy.log 2>/dev/null | tail -n1 || true)"
          if [[ -z "$worker_url" ]]; then
            echo "Could not resolve the operational medar-ops URL from Wrangler output."
            exit 1
          fi
          response="$(curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 "$worker_url/api/health")"
          printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);if(x.ok!==true||x.database!==true||x.authentication!=='username-password'){console.error('Unexpected operational health response:',s);process.exit(1)}console.log('Operational Worker database health OK:',s)})"
          WORKER_URL="$worker_url" node --input-type=module <<'NODE'
          const base = process.env.WORKER_URL;
          const rootResponse = await fetch(base + '/');
          if (!rootResponse.ok) throw new Error('Operational root failed: ' + rootResponse.status);
          const html = await rootResponse.text();
          if (!html.includes('id="root"')) throw new Error('Operational root HTML is missing the React root.');
          const jsPaths = [...new Set([...html.matchAll(/(?:src|href)="([^"]+\.js)"/g)].map(m => new URL(m[1], base + '/').pathname))];
          const cssPaths = [...new Set([...html.matchAll(/href="([^"]+\.css)"/g)].map(m => new URL(m[1], base + '/').pathname))];
          if (!jsPaths.length || !cssPaths.length) throw new Error('Operational HTML has no JS or CSS references.');
          const getText = async path => {
            const response = await fetch(new URL(path, base + '/'));
            if (!response.ok) throw new Error(path + ' returned ' + response.status);
            return response.text();
          };
          const [js, css] = await Promise.all([Promise.all(jsPaths.map(getText)), Promise.all(cssPaths.map(getText))]);
          if (!js.join('\n').includes('simorgh-signin-layer') || !js.join('\n').includes('ثبت‌نام عمومی غیرفعال است')) throw new Error('Live operational JS bundle is missing private sign-in/registration gating.');
          if (!css.join('\n').includes('simorgh-signin-layer')) throw new Error('Live operational CSS is missing the sign-in surface.');
          if (!css.join('\n').includes('--medar-ui-release') || !css.join('\n').includes('2026-10-21')) throw new Error('Live operational CSS does not include the expected Medar UX release marker.');
          if (!css.join('\n').includes('.nav-tools-box') || !css.join('\n').includes('medar-help-dialog')) throw new Error('Live operational CSS is missing the compact navigation/help fixes.');
          const deepLink = await fetch(base + '/app/command');
          if (!deepLink.ok || !(await deepLink.text()).includes('id="root"')) throw new Error('Operational /app/command deep-link failed.');
          const meResponse = await fetch(base + '/api/auth/me');
          if (!meResponse.ok) throw new Error('Unauthenticated session inspection failed: ' + meResponse.status);
          const session = await meResponse.json();
          if (session.user !== null || !Array.isArray(session.memberships)) throw new Error('Unexpected unauthenticated session payload.');
          console.log('Operational root, live JS/CSS with Medar UX release marker, /app/command deep-link, and unauthenticated session response verified.');
          NODE
      - name: Verify configured external frontend CORS origins
        shell: bash
        run: |
          set -euo pipefail
          custom_origins="$(printf '%s' "$MEDAR_ALLOWED_ORIGINS" | tr -d '[:space:]')"
          if [[ -z "$custom_origins" ]]; then
            echo "No separate static-host origin configured; same-origin Worker hosting remains the recommended default."
            exit 0
          fi
          worker_url="$(grep -Eo 'https://medar-ops\\.[a-z0-9-]+\\.workers\\.dev' /tmp/medar-ops-deploy.log 2>/dev/null | tail -n1 || true)"
          test -n "$worker_url"
          health_response="$(curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "$worker_url/api/health")"
          printf '%s' "$health_response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{let x;try{x=JSON.parse(s)}catch{console.error('Operational health endpoint returned non-JSON:',s.slice(0,250));process.exit(1)}if(x.ok!==true||x.database!==true||x.service!=='medar-ops'||x.authentication!=='username-password'){console.error('Worker is not in operational runtime mode:',JSON.stringify({ok:x.ok,database:x.database,service:x.service,authentication:x.authentication,code:x.code}));process.exit(1)}console.log('Operational Worker runtime mode and database confirmed:',JSON.stringify({service:x.service,database:x.database,authentication:x.authentication}))})"
          WORKER_URL="$worker_url" MEDAR_ALLOWED_ORIGINS="$custom_origins" node --input-type=module <<'NODE'
          const base = process.env.WORKER_URL;
          const origins = (process.env.MEDAR_ALLOWED_ORIGINS ?? '').split(',').filter(Boolean);
          for (const origin of origins) {
            const parsed = new URL(origin);
            if (parsed.protocol !== 'https:' || parsed.origin !== origin) {
              throw new Error('MEDAR_ALLOWED_ORIGINS entries must be exact HTTPS origins without paths: ' + origin);
            }
            const response = await fetch(base + '/api/auth/login', {
              method: 'OPTIONS',
              headers: {
                Origin: origin,
                'Access-Control-Request-Method': 'POST',
                'Access-Control-Request-Headers': 'content-type',
              },
            });
            if (response.status !== 204 ||
                response.headers.get('access-control-allow-origin') !== origin ||
                response.headers.get('access-control-allow-credentials') !== 'true') {
              throw new Error('Configured origin failed the live credentialed CORS preflight: ' + origin +
                ' (status ' + response.status + ', ACAO=' + response.headers.get('access-control-allow-origin') + ')');
            }
          }
          console.log('Verified credentialed CORS preflight for ' + origins.length + ' configured external frontend origins.');
          NODE

      - name: Install Chromium for live Worker verification
