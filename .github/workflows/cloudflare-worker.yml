name: Deploy Medar to Cloudflare Workers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MEDAR_DATABASE_URL: ${{ secrets.MEDAR_DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Validate deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$MEDAR_DATABASE_URL" || { echo "MEDAR_DATABASE_URL is missing"; exit 1; }
      - name: Apply Medar schema migrations to Neon
        shell: bash
        run: |
          psql "$MEDAR_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f worker/migrations/0001_foundation.sql \
            -f worker/migrations/0002_username_password_auth.sql \
            -f worker/migrations/0003_core_business_schema.sql \
            -f worker/migrations/0004_operational_integrity_schema.sql \
            -f worker/migrations/0005_runtime_security_hardening.sql \
            -f worker/migrations/0006_additional_operational_modules.sql
      - name: Configure Neon database secret
        working-directory: worker
        shell: bash
        run: printf '%s' "$MEDAR_DATABASE_URL" | npx wrangler@4 secret put DATABASE_URL
      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler@4 deploy --name medar-api-migration
