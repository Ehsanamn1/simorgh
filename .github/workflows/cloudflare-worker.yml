name: Deploy Medar to Cloudflare Workers
on:
  workflow_dispatch:
  push:
    branches: [feature/medar-auth-and-operations-cutover]
permissions:
  contents: read
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-medar]')
    runs-on: ubuntu-latest
    env:
      MEDAR_DATABASE_URL: ${{ secrets.MEDAR_DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Validate deployment credentials before expensive tests or database changes
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$MEDAR_DATABASE_URL" || { echo "MEDAR_DATABASE_URL is missing"; exit 1; }
      - name: Verify deployment targets the isolated Medar migration branch
        shell: bash
        run: |
          set -euo pipefail
          db_host="$(node -e "process.stdout.write(new URL(process.env.MEDAR_DATABASE_URL).hostname)")"
          case "$db_host" in
            ep-wild-mountain-baaweix2* ) echo "Verified isolated Neon migration endpoint: $db_host" ;;
            * ) echo "Refusing to migrate or deploy: MEDAR_DATABASE_URL must target the isolated medar-migration branch endpoint (ep-wild-mountain-baaweix2*)." >&2; exit 1 ;;
          esac
      - name: Build Pages-shaped bundle required by the Playwright server
        run: npm run build:pages
        env:
          VITE_ENABLE_AUTH_UI: 'true'
      - name: Install Chromium for end-to-end release gate
        run: npx playwright install --with-deps chromium
      - name: Run complete browser acceptance suite before touching Neon
        run: npm run test:e2e
      - name: Build Worker-served SPA bundle
        run: npm run build
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply additive Neon migrations in order
        shell: bash
        run: |
          set -euo pipefail
          for migration in worker/migrations/*.sql; do
            echo "Applying $migration"
            psql "$MEDAR_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Configure Neon database secret
        working-directory: worker
        shell: bash
        run: printf '%s' "$MEDAR_DATABASE_URL" | npx wrangler@4 secret put DATABASE_URL
      - name: Deploy Worker
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4 deploy --name medar-api 2>&1 | tee "$RUNNER_TEMP/worker-deploy.log"
          worker_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$RUNNER_TEMP/worker-deploy.log" | tail -n 1 || true)"
          if [[ -z "$worker_url" ]]; then echo "Could not extract the deployed Worker URL."; exit 1; fi
          echo "MEDAR_WORKER_URL=$worker_url" >> "$GITHUB_ENV"
      - name: Smoke-test Worker health, database, and authentication guards
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "$MEDAR_WORKER_URL/api/health")"
          echo "$response"
          echo "$response" | grep -q '"ok":true'
          echo "$response" | grep -q '"database":true'

          auth_status="$(curl --silent --show-error -o "$RUNNER_TEMP/auth-me.json" -w '%{http_code}' "$MEDAR_WORKER_URL/api/auth/me")"
          cat "$RUNNER_TEMP/auth-me.json"
          test "$auth_status" = "401"
          grep -q '"user":null' "$RUNNER_TEMP/auth-me.json"

          protected_status="$(curl --silent --show-error -o "$RUNNER_TEMP/protected.json" -w '%{http_code}' "$MEDAR_WORKER_URL/api/workspace/memberships")"
          cat "$RUNNER_TEMP/protected.json"
          test "$protected_status" = "401"

          signup_status="$(curl --silent --show-error -o "$RUNNER_TEMP/signup-validation.json" -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "$MEDAR_WORKER_URL/api/auth/signup")"
          cat "$RUNNER_TEMP/signup-validation.json"
          test "$signup_status" = "400"
      - name: Verify real username/password lifecycle and cross-company isolation
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/medar-live-auth-smoke"
          mkdir -p "$tmp"
          touch "$tmp/a-signup.cookies" "$tmp/a-login.cookies" "$tmp/a-new-password.cookies" "$tmp/b-signup.cookies" "$tmp/b-login.cookies" "$tmp/old-password.cookies"
          user_a="ci_smoke_\${GITHUB_RUN_ID}"
          user_b="ci_smoke_b_\${GITHUB_RUN_ID}"
          phone_a="09$(printf '%09d' "$((GITHUB_RUN_ID % 1000000000))")"
          phone_b="09$(printf '%09d' "$(((GITHUB_RUN_ID + 1) % 1000000000))")"
          org_a="CI Smoke A \${GITHUB_RUN_ID}"
          org_b="CI Smoke B \${GITHUB_RUN_ID}"
          password_old="MedarCI-\${GITHUB_RUN_ID}-Old!"
          password_new="MedarCI-\${GITHUB_RUN_ID}-New!"
          cleanup() {
            psql "$MEDAR_DATABASE_URL" -v ON_ERROR_STOP=1 -v ua="$user_a" -v ub="$user_b" -v oa="$org_a" -v ob="$org_b" <<'SQL'
          DELETE FROM public.medar_sessions WHERE user_id IN (SELECT id FROM public.medar_users WHERE username IN (:'ua', :'ub'));
          DELETE FROM public.medar_audit_log WHERE actor_user_id IN (SELECT id FROM public.medar_users WHERE username IN (:'ua', :'ub'));
          DELETE FROM public.access_requests WHERE user_id IN (SELECT id FROM public.medar_users WHERE username IN (:'ua', :'ub')) OR company_id IN (SELECT id FROM public.companies WHERE name IN (:'oa', :'ob'));
          DELETE FROM public.memberships WHERE user_id IN (SELECT id FROM public.medar_users WHERE username IN (:'ua', :'ub')) OR company_id IN (SELECT id FROM public.companies WHERE name IN (:'oa', :'ob'));
          DELETE FROM public.profiles WHERE id IN (SELECT id FROM public.medar_users WHERE username IN (:'ua', :'ub'));
          DELETE FROM public.companies WHERE name IN (:'oa', :'ob');
          DELETE FROM public.medar_users WHERE username IN (:'ua', :'ub');
          SQL
          }
          finish() {
            original_status=$?
            trap - EXIT
            if ! cleanup; then echo "Warning: live smoke account cleanup failed." >&2; exit 1; fi
            exit "$original_status"
          }
          trap finish EXIT

          payload_a="$(jq -n --arg username "$user_a" --arg phone "$phone_a" --arg org "$org_a" --arg password "$password_old" '{username:$username,phone:$phone,displayName:"CI Smoke A",organizationName:$org,requestedRole:"owner",password:$password}')"
          signup_a_status="$(curl --silent --show-error -o "$tmp/signup-a.json" -w '%{http_code}' -c "$tmp/a-signup.cookies" -H 'content-type: application/json' -X POST --data "$payload_a" "$MEDAR_WORKER_URL/api/auth/signup")"
          cat "$tmp/signup-a.json"
          test "$signup_a_status" = "201"
          jq -e --arg username "$user_a" '.user.username == $username' "$tmp/signup-a.json" >/dev/null

          login_a_status="$(curl --silent --show-error -o "$tmp/login-a.json" -w '%{http_code}' -b "$tmp/a-login.cookies" -c "$tmp/a-login.cookies" -H 'content-type: application/json' -X POST --data "$(jq -n --arg username "$user_a" --arg password "$password_old" '{username:$username,password:$password}')" "$MEDAR_WORKER_URL/api/auth/login")"
          cat "$tmp/login-a.json"
          test "$login_a_status" = "200"
          memberships_a_status="$(curl --silent --show-error -o "$tmp/memberships-a.json" -w '%{http_code}' -b "$tmp/a-login.cookies" "$MEDAR_WORKER_URL/api/workspace/memberships")"
          test "$memberships_a_status" = "200"
          company_a="$(jq -r '.memberships[0].company_id // empty' "$tmp/memberships-a.json")"
          test -n "$company_a"
          jq -e '.memberships[0].role == "owner"' "$tmp/memberships-a.json" >/dev/null

          payload_b="$(jq -n --arg username "$user_b" --arg phone "$phone_b" --arg org "$org_b" --arg password "$password_old" '{username:$username,phone:$phone,displayName:"CI Smoke B",organizationName:$org,requestedRole:"owner",password:$password}')"
          signup_b_status="$(curl --silent --show-error -o "$tmp/signup-b.json" -w '%{http_code}' -c "$tmp/b-signup.cookies" -H 'content-type: application/json' -X POST --data "$payload_b" "$MEDAR_WORKER_URL/api/auth/signup")"
          cat "$tmp/signup-b.json"
          test "$signup_b_status" = "201"
          login_b_status="$(curl --silent --show-error -o "$tmp/login-b.json" -w '%{http_code}' -b "$tmp/b-login.cookies" -c "$tmp/b-login.cookies" -H 'content-type: application/json' -X POST --data "$(jq -n --arg username "$user_b" --arg password "$password_old" '{username:$username,password:$password}')" "$MEDAR_WORKER_URL/api/auth/login")"
          test "$login_b_status" = "200"

          cross_company_status="$(curl --silent --show-error -o "$tmp/cross-company.json" -w '%{http_code}' -b "$tmp/b-login.cookies" -H 'content-type: application/json' -X POST --data "$(jq -n --arg companyId "$company_a" '{companyId:$companyId,query:{select:"id",limit:1}}')" "$MEDAR_WORKER_URL/api/data/orders/query")"
          cat "$tmp/cross-company.json"
          test "$cross_company_status" = "403"

          wrong_current_status="$(curl --silent --show-error -o "$tmp/wrong-current.json" -w '%{http_code}' -b "$tmp/a-login.cookies" -H 'content-type: application/json' -X POST --data "$(jq -n --arg currentPassword "wrong-\${GITHUB_RUN_ID}" --arg newPassword "$password_new" '{currentPassword:$currentPassword,newPassword:$newPassword}')" "$MEDAR_WORKER_URL/api/auth/change-password")"
          test "$wrong_current_status" = "403"
          change_status="$(curl --silent --show-error -o "$tmp/change-password.json" -w '%{http_code}' -b "$tmp/a-login.cookies" -c "$tmp/a-login.cookies" -H 'content-type: application/json' -X POST --data "$(jq -n --arg currentPassword "$password_old" --arg newPassword "$password_new" '{currentPassword:$currentPassword,newPassword:$newPassword}')" "$MEDAR_WORKER_URL/api/auth/change-password")"
          cat "$tmp/change-password.json"
          test "$change_status" = "200"
          me_after_change="$(curl --silent --show-error -o "$tmp/me-after-change.json" -w '%{http_code}' -b "$tmp/a-login.cookies" "$MEDAR_WORKER_URL/api/auth/me")"
          test "$me_after_change" = "200"
          revoked_signup_session="$(curl --silent --show-error -o "$tmp/revoked-session.json" -w '%{http_code}' -b "$tmp/a-signup.cookies" "$MEDAR_WORKER_URL/api/auth/me")"
          test "$revoked_signup_session" = "401"

          old_login_status="$(curl --silent --show-error -o "$tmp/old-login.json" -w '%{http_code}' -b "$tmp/old-password.cookies" -c "$tmp/old-password.cookies" -H 'content-type: application/json' -X POST --data "$(jq -n --arg username "$user_a" --arg password "$password_old" '{username:$username,password:$password}')" "$MEDAR_WORKER_URL/api/auth/login")"
          test "$old_login_status" = "401"
          new_login_status="$(curl --silent --show-error -o "$tmp/new-login.json" -w '%{http_code}' -b "$tmp/a-new-password.cookies" -c "$tmp/a-new-password.cookies" -H 'content-type: application/json' -X POST --data "$(jq -n --arg username "$user_a" --arg password "$password_new" '{username:$username,password:$password}')" "$MEDAR_WORKER_URL/api/auth/login")"
          cat "$tmp/new-login.json"
          test "$new_login_status" = "200"
          logout_status="$(curl --silent --show-error -o "$tmp/logout.json" -w '%{http_code}' -b "$tmp/a-new-password.cookies" -c "$tmp/a-new-password.cookies" -X POST "$MEDAR_WORKER_URL/api/auth/logout")"
          test "$logout_status" = "200"
          logout_me_status="$(curl --silent --show-error -o "$tmp/logout-me.json" -w '%{http_code}' -b "$tmp/a-new-password.cookies" "$MEDAR_WORKER_URL/api/auth/me")"
          test "$logout_me_status" = "401"
          echo "Real username/password lifecycle, password change, session revocation, logout, and cross-company denial passed."
