name: Deploy Medar to Cloudflare Workers
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MEDAR_DATABASE_URL: ${{ secrets.MEDAR_DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Build Worker app in public demo mode
        run: npm run build
        env:
          VITE_ENABLE_AUTH_UI: 'false'
      - name: Verify the Worker bundle includes the public demo, mobile navigation, and polished UI
        shell: bash
        run: |
          test -f dist/index.html
          grep -q 'id="root"' dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.css' -print -quit)"
          grep -Rqs --include='*.js' 'demo-workspace' dist/assets
          grep -Rqs --include='*.js' 'دموی قابل ارائه' dist/assets
          grep -Rqs --include='*.js' 'demo-mobile-bottom-nav' dist/assets
          grep -Rqs --include='*.js' 'demo-quick-access' dist/assets
          grep -Rqs --include='*.css' 'demo-workspace' dist/assets
          grep -Rqs --include='*.css' 'demo-mobile-bottom-nav' dist/assets
          grep -Rqs --include='*.css' 'medar-glass' dist/assets
          echo "Worker frontend includes the public demo, four-item mobile navigation, quick actions, and polished styles."
      - name: Validate deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$MEDAR_DATABASE_URL" || { echo "MEDAR_DATABASE_URL is missing"; exit 1; }
      - name: Verify the established Medar schema before migration
        shell: bash
        run: |
          schema_ready="$(psql "$MEDAR_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "select (to_regclass('public.medar_users') is not null and to_regclass('public.medar_sessions') is not null and to_regclass('public.companies') is not null and to_regclass('public.memberships') is not null and to_regclass('public.orders') is not null)")"
          if [[ "$schema_ready" != "t" ]]; then
            echo "MEDAR_DATABASE_URL must point to the existing Medar migration branch. Refusing to replay initial schema on a different or empty database."
            exit 1
          fi
      - name: Apply versioned compatibility migrations to Neon
        shell: bash
        run: |
          psql "$MEDAR_DATABASE_URL" -v ON_ERROR_STOP=1 -c "create table if not exists public.medar_schema_migrations (version text primary key, checksum text not null, applied_at timestamptz not null default now())"
          for migration in worker/migrations/0007_existing_medar_schema_compat.sql worker/migrations/0008_operational_task_actions.sql worker/migrations/0009_inventory_movement_concurrency_lock.sql worker/migrations/0010_purchase_order_lifecycle.sql; do
            version="$(basename "$migration")"
            checksum="$(sha256sum "$migration" | awk '{print $1}')"
            applied="$(psql "$MEDAR_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "select checksum from public.medar_schema_migrations where version = '$version'")"
            if [ -n "$applied" ]; then
              if [ "$applied" != "$checksum" ]; then
                echo "Migration checksum mismatch for $version. Applied migrations must not be edited in place."
                exit 1
              fi
              echo "Skipping already-applied migration $version"
              continue
            fi
            echo "Applying $version"
            psql "$MEDAR_DATABASE_URL" -v ON_ERROR_STOP=1 -1 -f "$migration"
            psql "$MEDAR_DATABASE_URL" -v ON_ERROR_STOP=1 -c "insert into public.medar_schema_migrations(version,checksum) values ('$version','$checksum')"
          done
      - name: Verify required Medar RPCs and migration ledger
        shell: bash
        run: |
          readiness="$(psql "$MEDAR_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            select (
              to_regclass('public.medar_users') is not null and
              to_regclass('public.medar_sessions') is not null and
              to_regclass('public.medar_rate_limits') is not null and
              to_regclass('public.medar_audit_log') is not null and
              to_regclass('public.company_invites') is not null and
              to_regclass('public.medar_files') is not null and
              to_regclass('public.purchase_orders') is not null and
              to_regclass('public.purchase_order_items') is not null and
              to_regprocedure('public.medar_allocate_order_item(uuid,uuid,uuid,uuid)') is not null and
              to_regprocedure('public.medar_record_inventory_movement(uuid,uuid,uuid,text,numeric,numeric,uuid,uuid,uuid,text,text)') is not null and
              position('pg_advisory_xact_lock' in pg_get_functiondef(to_regprocedure('public.medar_record_inventory_movement(uuid,uuid,uuid,text,numeric,numeric,uuid,uuid,uuid,text,text)'))) > 0 and
              to_regprocedure('public.medar_record_quality_review(uuid,uuid,uuid,text,text,jsonb)') is not null and
              to_regprocedure('public.medar_start_operational_task(uuid,uuid)') is not null and
              to_regprocedure('public.medar_submit_operational_task(uuid,uuid,text)') is not null and
              to_regprocedure('public.medar_review_operational_task(uuid,uuid,text,text)') is not null and
              to_regprocedure('public.medar_create_partner_settlement_period(uuid,uuid,date,date)') is not null and
              to_regprocedure('public.medar_refresh_partner_settlement_period(uuid,uuid)') is not null and
              to_regprocedure('public.medar_approve_partner_settlement_period(uuid,uuid)') is not null and
              to_regprocedure('public.medar_record_partner_settlement_payment(uuid,uuid,numeric,text,timestamptz)') is not null and
              to_regprocedure('public.medar_create_purchase_order(uuid,uuid,uuid,text,jsonb,date,text)') is not null and
              to_regprocedure('public.medar_approve_purchase_order(uuid,uuid,uuid)') is not null and
              to_regprocedure('public.medar_receive_purchase_order(uuid,uuid,uuid,jsonb,text,text)') is not null and
              (select count(*) from public.medar_schema_migrations where version in ('0007_existing_medar_schema_compat.sql','0008_operational_task_actions.sql','0009_inventory_movement_concurrency_lock.sql','0010_purchase_order_lifecycle.sql')) = 4
            )
          ")"
          if [[ "$readiness" != "t" ]]; then
            echo "Neon schema is missing a required table, versioned migration, or Worker RPC. Refusing deployment."
            exit 1
          fi
      - name: Keep private file storage disabled until explicitly requested
        run: echo "R2 setup is intentionally out of scope; file routes remain unavailable without FILE_STORE."
      - name: Configure Neon database secret
        working-directory: worker
        shell: bash
        run: printf '%s' "$MEDAR_DATABASE_URL" | npx wrangler@4 secret put DATABASE_URL
      - name: Deploy Worker
        working-directory: worker
        run: set -o pipefail; npx wrangler@4 deploy --name medar-api 2>&1 | tee /tmp/medar-deploy.log
      - name: Smoke-test the live Worker
        shell: bash
        run: |
          worker_url="$(grep -Eo 'https://medar-api\.[a-z0-9-]+\.workers\.dev' /tmp/medar-deploy.log 2>/dev/null | tail -n1 || true)"
          if [[ -z "$worker_url" ]]; then
            echo "Could not resolve the deployed workers.dev URL from Wrangler output."
            exit 1
          fi
          response="$(curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 "$worker_url/api/health")"
          printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);if(x.status!=='ok' && x.ok!==true && x.healthy!==true){console.error('Unexpected health response:',s);process.exit(1)}console.log('Live Worker health OK:',s)})"
          name="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "$worker_url/")"
          printf '%s' "$name" | grep -q 'id="root"' || { echo "The live Worker root is missing the frontend root element."; exit 1; }
          asset_results="$(WORKER_URL="$worker_url" node --input-type=module <<'NODE'
          const base = process.env.WORKER_URL;
          const htmlResponse = await fetch(base + '/');
          if (!htmlResponse.ok) throw new Error('Root HTML failed: ' + htmlResponse.status);
          const html = await htmlResponse.text();
          const jsPaths = [...new Set([...html.matchAll(/(?:src|href)="([^"]+\.js)"/g)].map(match => match[1]))];
          const cssPaths = [...new Set([...html.matchAll(/href="([^"]+\.css)"/g)].map(match => match[1]))];
          if (!jsPaths.length || !cssPaths.length) throw new Error('Root HTML is missing JS/CSS assets.');
          const resolve = path => new URL(path, base + '/').toString();
          const fetchTexts = async paths => Promise.all(paths.map(async path => {
            const response = await fetch(resolve(path));
            if (!response.ok) throw new Error('Frontend asset failed: ' + path + ' (' + response.status + ')');
            return response.text();
          }));
          const [jsFiles, cssFiles] = await Promise.all([fetchTexts(jsPaths), fetchTexts(cssPaths)]);
          const js = jsFiles.join('\n');
          const css = cssFiles.join('\n');
          for (const token of ['demo-workspace', 'دموی قابل ارائه', 'demo-mobile-bottom-nav', 'demo-quick-access']) if (!js.includes(token)) throw new Error('Live JS bundles missing public demo/navigation token: ' + token);
          for (const token of ['demo-workspace', 'demo-mobile-bottom-nav', 'medar-glass']) if (!css.includes(token)) throw new Error('Live CSS bundles missing expected demo/design token: ' + token);
          const appRoute = await fetch(base + '/app/command');
          if (!appRoute.ok || !(await appRoute.text()).includes('id="root"')) throw new Error('SPA deep-link fallback failed for /app/command');
          console.log('Live demo, mobile navigation, quick access assets and /app/command deep link OK');
          NODE
          )" || { echo "Live frontend smoke test failed."; exit 1; }
          echo "$asset_results"
      - name: Install Chromium for live Worker UI verification
        run: npx playwright install --with-deps chromium
      - name: Verify the deployed public demo, four-item mobile navigation, and responsive layout
        shell: bash
        run: |
          worker_url="$(grep -Eo 'https://medar-api\.[a-z0-9-]+\.workers\.dev' /tmp/medar-deploy.log 2>/dev/null | tail -n1 || true)"
          test -n "$worker_url"
          WORKER_URL="$worker_url" node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const base = process.env.WORKER_URL;
          const browser = await chromium.launch({ headless: true });
          const errors = [];
          try {
            const page = await browser.newPage({ viewport: { width: 1365, height: 900 } });
            page.on('pageerror', error => errors.push(error.message));
            const response = await page.goto(base + '/', { waitUntil: 'networkidle', timeout: 60000 });
            if (!response?.ok()) throw new Error('Public demo root did not return a successful app shell.');
            await page.locator('.demo-workspace').waitFor({ state: 'visible', timeout: 20000 });
            if (await page.locator('.simorgh-signin-layer').count()) throw new Error('Sign-in UI must stay hidden in the public demo.');
            if (await page.locator('.app-frame, .setup-screen').count()) throw new Error('Protected workspace/setup screen rendered instead of demo.');
            await page.getByRole('heading', { name: 'عملیات، در یک نگاه.' }).waitFor({ state: 'visible' });
            await page.locator('.demo-quick-access').waitFor({ state: 'visible' });
            await page.locator('.demo-quick-action').first().click();
            await page.getByRole('heading', { name: 'سفارش‌ها', exact: true }).waitFor({ state: 'visible' });
            const desktop = await page.evaluate(() => ({ viewport: innerWidth, document: document.documentElement.scrollWidth, body: document.body.scrollWidth }));
            if (desktop.document > desktop.viewport || desktop.body > desktop.viewport) throw new Error('Desktop horizontal overflow: ' + JSON.stringify(desktop));

            await page.setViewportSize({ width: 390, height: 844 });
            await page.goto(base + '/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.locator('.demo-workspace').waitFor({ state: 'visible', timeout: 20000 });
            const nav = page.locator('.demo-mobile-bottom-nav');
            await nav.waitFor({ state: 'visible', timeout: 10000 });
            if (await nav.locator('button').count() !== 4) throw new Error('Mobile bottom navigation must have exactly four items.');
            if (await page.locator('.demo-quick-action').count() !== 4) throw new Error('Mobile quick access must have four actions.');
            await nav.getByRole('button', { name: 'ماژول‌ها' }).click();
            await page.locator('.demo-sidebar.is-open').waitFor({ state: 'visible' });
            await page.locator('.demo-nav-item').filter({ hasText: 'مشتریان' }).click();
            await page.getByRole('heading', { name: 'مشتریان', exact: true }).waitFor({ state: 'visible' });
            const mobile = await page.evaluate(() => ({ viewport: innerWidth, document: document.documentElement.scrollWidth, body: document.body.scrollWidth }));
            if (mobile.document > mobile.viewport || mobile.body > mobile.viewport) throw new Error('Mobile horizontal overflow: ' + JSON.stringify(mobile));
            if (errors.length) throw new Error('Live browser runtime errors: ' + errors.join(' | '));
            console.log('Live public demo, four-item mobile navigation, quick actions, and module drawer passed desktop/mobile checks.');
          } finally {
            await browser.close();
          }
          NODE

      - name: Verify unauthenticated Worker API access controls
        shell: bash
        run: |
          worker_url="$(grep -Eo 'https://medar-api\.[a-z0-9-]+\.workers\.dev' /tmp/medar-deploy.log 2>/dev/null | tail -n1 || true)"
          test -n "$worker_url"
          me_response="$(curl --fail --silent --show-error "$worker_url/api/auth/me")"
          printf '%s' "$me_response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);if(x.user!==null||!Array.isArray(x.memberships)){console.error('Unexpected unauthenticated session response:',s);process.exit(1)}console.log('Unauthenticated session shape OK')})"
          membership_status="$(curl --silent --show-error --output "$RUNNER_TEMP/medar-memberships.json" --write-out '%{http_code}' "$worker_url/api/workspace/memberships")"
          if [[ "$membership_status" != "401" ]]; then echo "Unauthenticated workspace memberships must return 401 (received $membership_status)."; cat "$RUNNER_TEMP/medar-memberships.json"; exit 1; fi
          echo "Unauthenticated workspace access correctly denied."
          cors_status="$(curl --silent --show-error --output "$RUNNER_TEMP/medar-cors.json" --write-out '%{http_code}' --request POST --header 'Origin: https://untrusted-origin.invalid' --header 'Content-Type: application/json' --data '{"username":"ab","password":"x"}' "$worker_url/api/auth/login")"
          if [[ "$cors_status" != "403" ]]; then echo "Untrusted-origin mutation must return 403 (received $cors_status)."; cat "$RUNNER_TEMP/medar-cors.json"; exit 1; fi
          echo "Cross-origin mutation guard OK."
          invalid_login_status="$(curl --silent --show-error --output "$RUNNER_TEMP/medar-invalid-login.json" --write-out '%{http_code}' --header 'Content-Type: application/json' --data '{"username":"ab","password":"x"}' "$worker_url/api/auth/login")"
          if [[ "$invalid_login_status" != "401" ]]; then echo "Malformed login must return 401 (received $invalid_login_status)."; cat "$RUNNER_TEMP/medar-invalid-login.json"; exit 1; fi
          echo "Malformed login rejected without touching account data."
