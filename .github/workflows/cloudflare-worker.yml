name: Deploy Medar to Cloudflare Workers
on:
  workflow_dispatch:
  push:
    branches: [feature/medar-auth-and-operations-cutover]
permissions:
  contents: read
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-medar]')
    runs-on: ubuntu-latest
    env:
      MEDAR_DATABASE_URL: ${{ secrets.MEDAR_DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Validate deployment credentials before expensive tests or database changes
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$MEDAR_DATABASE_URL" || { echo "MEDAR_DATABASE_URL is missing"; exit 1; }
      - name: Verify deployment targets the isolated Medar migration branch
        shell: bash
        run: |
          set -euo pipefail
          db_host="$(node -e "process.stdout.write(new URL(process.env.MEDAR_DATABASE_URL).hostname)")"
          case "$db_host" in
            ep-wild-mountain-baaweix2* ) echo "Verified isolated Neon migration endpoint: $db_host" ;;
            * ) echo "Refusing to migrate or deploy: MEDAR_DATABASE_URL must target the isolated medar-migration branch endpoint (ep-wild-mountain-baaweix2*)." >&2; exit 1 ;;
          esac
      - name: Build Pages-shaped bundle required by the Playwright server
        run: npm run build:pages
        env:
          VITE_ENABLE_AUTH_UI: 'true'
      - name: Install Chromium for end-to-end release gate
        run: npx playwright install --with-deps chromium
      - name: Run complete browser acceptance suite before touching Neon
        run: npm run test:e2e
      - name: Build Worker-served SPA bundle
        run: npm run build
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply additive Neon migrations in order
        shell: bash
        run: |
          set -euo pipefail
          for migration in worker/migrations/*.sql; do
            echo "Applying $migration"
            psql "$MEDAR_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Configure Neon database secret
        working-directory: worker
        shell: bash
        run: printf '%s' "$MEDAR_DATABASE_URL" | npx wrangler@4 secret put DATABASE_URL
      - name: Deploy Worker
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4 deploy --name medar-api 2>&1 | tee "$RUNNER_TEMP/worker-deploy.log"
          worker_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$RUNNER_TEMP/worker-deploy.log" | tail -n 1 || true)"
          if [[ -z "$worker_url" ]]; then echo "Could not extract the deployed Worker URL."; exit 1; fi
          echo "MEDAR_WORKER_URL=$worker_url" >> "$GITHUB_ENV"
      - name: Smoke-test Worker health, database, and authentication guards
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "$MEDAR_WORKER_URL/api/health")"
          echo "$response"
          echo "$response" | grep -q '"ok":true'
          echo "$response" | grep -q '"database":true'

          auth_status="$(curl --silent --show-error -o "$RUNNER_TEMP/auth-me.json" -w '%{http_code}' "$MEDAR_WORKER_URL/api/auth/me")"
          cat "$RUNNER_TEMP/auth-me.json"
          test "$auth_status" = "401"
          grep -q '"user":null' "$RUNNER_TEMP/auth-me.json"

          protected_status="$(curl --silent --show-error -o "$RUNNER_TEMP/protected.json" -w '%{http_code}' "$MEDAR_WORKER_URL/api/workspace/memberships")"
          cat "$RUNNER_TEMP/protected.json"
          test "$protected_status" = "401"

          signup_status="$(curl --silent --show-error -o "$RUNNER_TEMP/signup-validation.json" -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "$MEDAR_WORKER_URL/api/auth/signup")"
          cat "$RUNNER_TEMP/signup-validation.json"
          test "$signup_status" = "400"
