name: Simorgh Android App

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    name: Build native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm install

      - name: Require a Worker API URL before publishing mobile artifacts
        if: github.event_name != 'pull_request'
        env:
          MEDAR_API_BASE_URL: ${{ vars.MEDAR_OPS_API_BASE_URL || 'https://medar-ops.dengxiao445.workers.dev' }}
        run: |
          if [[ -z "$MEDAR_API_BASE_URL" || "$MEDAR_API_BASE_URL" != https://* ]]; then
            echo "Set MEDAR_OPS_API_BASE_URL to the authenticated medar-ops Worker before building an operational mobile app."
            exit 1
          fi

      - name: Build application assets
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.MEDAR_OPS_API_BASE_URL || 'https://medar-ops.dengxiao445.workers.dev' }}
          VITE_ENABLE_AUTH_UI: 'true'

      - name: Verify the mobile bundle has the public demo and the live API endpoint
        shell: bash
        run: |
          test -f dist/index.html
          grep -Rqs --include='*.js' 'simorgh-signin-layer' dist/assets
          grep -Rqs --include='*.js' 'ورود به مدار' dist/assets
          grep -Rqs --include='*.js' 'ساخت حساب و فضای کاری' dist/assets
          grep -Rqs --include='*.js' 'medar-ops.dengxiao445.workers.dev' dist/assets
          grep -Rqs --include='*.css' 'simorgh-signin-layer' dist/assets
          echo "Android bundle includes the authenticated operational workspace, phone/username sign-in, and medar-ops API URL."


      - name: Generate Android native project
        run: npx cap add android

      - name: Synchronize native plugins and assets
        run: npx cap sync android

      - name: Build unsigned debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: simorgh-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
