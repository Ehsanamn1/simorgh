name: Import Simorgh source
on:
  push:
    paths:
      - 'simorgh-bundle/READY'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore application source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json ]]; then
            echo "Application source already exists; nothing to import."
            exit 0
          fi
          cat simorgh-bundle/part-01 simorgh-bundle/part-02 simorgh-bundle/part-03 simorgh-bundle/part-04 simorgh-bundle/part-05 simorgh-bundle/part-06 simorgh-bundle/part-07a simorgh-bundle/part-07b simorgh-bundle/part-07c simorgh-bundle/part-08a simorgh-bundle/part-08b simorgh-bundle/part-08c simorgh-bundle/part-09a simorgh-bundle/part-09b > "$RUNNER_TEMP/simorgh.bundle.b64"
          base64 --decode "$RUNNER_TEMP/simorgh.bundle.b64" > "$RUNNER_TEMP/simorgh.bundle"
          git clone "$RUNNER_TEMP/simorgh.bundle" "$RUNNER_TEMP/source"
          rsync -a --exclude='.git' --exclude='.github/workflows/ci.yml' "$RUNNER_TEMP/source/" "$GITHUB_WORKSPACE/"
          rm -rf simorgh-bundle .github/workflows/import-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Simorgh application source"
          git push origin HEAD:main
