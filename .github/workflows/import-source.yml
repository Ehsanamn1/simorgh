name: Import Simorgh source
on:
  push:
    paths:
      - 'simorgh-source.bundle.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore application source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json ]]; then
            echo "Application source already exists; nothing to import."
            exit 0
          fi
          base64 --decode simorgh-source.bundle.b64 > "$RUNNER_TEMP/simorgh.bundle"
          git clone "$RUNNER_TEMP/simorgh.bundle" "$RUNNER_TEMP/source"
          rsync -a --exclude='.git' "$RUNNER_TEMP/source/" "$GITHUB_WORKSPACE/"
          rm -f simorgh-source.bundle.b64 .github/workflows/import-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Simorgh application source"
          git push origin HEAD:main
