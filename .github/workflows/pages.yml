name: Deploy Simorgh to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: simorgh-pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Build for GitHub Pages
        run: npm run build:pages
        env:
          VITE_ENABLE_AUTH_UI: 'false'
          VITE_DISABLE_API_UI: 'true'
      - name: Prepare SPA routing fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          cd dist
          zip -qr ../medar-static-site.zip .
          cd ..
          test -s medar-static-site.zip
      - name: Upload portable static-site ZIP
        uses: actions/upload-artifact@v5
        with:
          name: medar-static-site
          path: medar-static-site.zip
          if-no-files-found: error
          retention-days: 30
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test the published HTML, CSS, and JavaScript
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          html_file="$(mktemp)"
          css_file="$(mktemp)"
          js_file="$(mktemp)"
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 3 "$SITE_URL" -o "$html_file"
          grep -q 'id="root"' "$html_file"
          grep -q 'id="app-boot-screen"' "$html_file"
          js_path="$(grep -oE 'src="[^"]+[.]js"' "$html_file" | head -n 1 | cut -d '"' -f 2)"
          css_path="$(grep -oE 'href="[^"]+[.]css"' "$html_file" | head -n 1 | cut -d '"' -f 2)"
          if [[ -z "$js_path" || -z "$css_path" ]]; then
            echo "Published HTML is missing its JavaScript or CSS bundle reference."
            cat "$html_file"
            exit 1
          fi
          origin="$(python3 -c 'import os, urllib.parse; u=urllib.parse.urlparse(os.environ["SITE_URL"]); print(f"{u.scheme}://{u.netloc}")')"
          asset_url() {
            case "$1" in
              http://*|https://*) printf '%s' "$1" ;;
              /*) printf '%s%s' "$origin" "$1" ;;
              *) printf '%s/%s' "${SITE_URL%/}" "$1" ;;
            esac
          }
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 "$(asset_url "$js_path")" -o "$js_file"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 "$(asset_url "$css_path")" -o "$css_file"
          test -s "$js_file"
          test -s "$css_file"
          # Bundlers may split feature code and CSS into multiple hashed chunks.
          # Verify referenced assets are reachable here; the Playwright step below
          # validates the actual rendered DOM and demo-only notice.
          echo "Published app entry, JavaScript bundle, and CSS bundle are reachable."

      - name: Checkout source for the browser runtime smoke test
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install Chromium for published application test
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Verify the deployed app renders on desktop and mobile
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';

          const browser = await chromium.launch({ headless: true });
          const errors = [];
          try {
            const page = await browser.newPage({ viewport: { width: 1365, height: 900 } });
            page.on('pageerror', error => errors.push(error.message));
            await page.goto(process.env.SITE_URL, { waitUntil: 'networkidle', timeout: 60000 });
            await page.locator('#app-boot-screen').waitFor({ state: 'detached', timeout: 20000 });
            await page.locator('.demo-workspace').waitFor({ state: 'visible', timeout: 20000 });
            if (await page.locator('.simorgh-signin-layer').count()) throw new Error('Sign-in UI must be disabled on the public showcase.');
            if (await page.locator('.app-frame, .setup-screen').count()) throw new Error('Protected workspace or setup screen rendered instead of the public demo.');
            await page.getByRole('heading', { name: 'عملیات، در یک نگاه.' }).waitFor({ state: 'visible' });
            await page.locator('.demo-sidebar .demo-nav-item').filter({ hasText: /^سفارش‌ها$/ }).click();
            await page.locator('.demo-breadcrumb b').filter({ hasText: 'سفارش‌ها' }).waitFor({ state: 'visible' });
            if (errors.length) throw new Error('Browser runtime error: ' + errors.join(' | '));

            await page.setViewportSize({ width: 390, height: 844 });
            await page.reload({ waitUntil: 'networkidle', timeout: 60000 });
            await page.locator('#app-boot-screen').waitFor({ state: 'detached', timeout: 20000 });
            await page.locator('.demo-workspace').waitFor({ state: 'visible', timeout: 20000 });
            if (await page.locator('.simorgh-signin-layer').count() !== 0) throw new Error('The mobile showcase unexpectedly rendered sign-in UI.');
            if (await page.locator('.demo-preview-notice').count() !== 1) throw new Error('The mobile demo safety notice is missing.');
            const mobileNav = page.locator('.demo-mobile-bottom-nav');
            await mobileNav.waitFor({ state: 'visible', timeout: 10000 });
            if (await mobileNav.locator('button').count() !== 4) throw new Error('The mobile bottom navigation must contain exactly four items.');
            if (await page.locator('.demo-quick-action').count() !== 4) throw new Error('The mobile quick-access panel must contain four actions.');
            await page.locator('.demo-menu-button').click();
            if (!(await page.locator('.demo-sidebar').getAttribute('class') || '').includes('is-open')) throw new Error('The mobile navigation drawer did not open.');
            await page.locator('.demo-sidebar .demo-nav-item').filter({ hasText: /^سفارش‌ها$/ }).click();
            await page.locator('.demo-breadcrumb b').filter({ hasText: 'سفارش‌ها' }).waitFor({ state: 'visible' });
            const widths = await page.evaluate(() => ({ viewport: innerWidth, document: document.documentElement.scrollWidth, body: document.body.scrollWidth }));
            if (widths.document > widths.viewport || widths.body > widths.viewport) throw new Error('Mobile horizontal overflow: ' + JSON.stringify(widths));
            if (errors.length) throw new Error('Browser runtime error after mobile reload: ' + errors.join(' | '));
            await page.screenshot({ path: 'medar-published-mobile.png', fullPage: true });
            console.log('Published public demo rendered and passed desktop/mobile runtime checks: ' + process.env.SITE_URL);
          } finally {
            await browser.close();
          }
          NODE

      - name: Upload live deployment screenshot
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: medar-published-mobile-smoke
          path: medar-published-mobile.png
          if-no-files-found: ignore
          retention-days: 14
