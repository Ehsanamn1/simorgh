            ('00000000-0000-4000-8000-000000000122','CI notification company');
          INSERT INTO public.medar_users (id,username,username_normalized,phone_e164,display_name,password_hash) VALUES
            ('00000000-0000-4000-8000-000000000111','ci.notify.owner','ci.notify.owner','+989190000121','CI notification owner','not-a-login-hash'),
            ('00000000-0000-4000-8000-000000000112','ci.notify.staff','ci.notify.staff','+989190000122','CI notification staff','not-a-login-hash');
          INSERT INTO public.memberships (company_id,user_id,role,active,created_by) VALUES
            ('00000000-0000-4000-8000-000000000122','00000000-0000-4000-8000-000000000111','owner',true,'00000000-0000-4000-8000-000000000111'),
            ('00000000-0000-4000-8000-000000000122','00000000-0000-4000-8000-000000000112','staff',true,'00000000-0000-4000-8000-000000000111');
          INSERT INTO public.operational_tasks (company_id,assignee_user_id,assigned_by,title,due_at)
          VALUES ('00000000-0000-4000-8000-000000000122','00000000-0000-4000-8000-000000000112','00000000-0000-4000-8000-000000000111','CI task assignment notification',now()+interval '2 hours');
          INSERT INTO public.medar_conversations (id,company_id,title,created_by)
          VALUES ('00000000-0000-4000-8000-000000000124','00000000-0000-4000-8000-000000000122','CI notification conversation','00000000-0000-4000-8000-000000000111');
          INSERT INTO public.medar_conversation_participants (company_id,conversation_id,user_id,participant_role) VALUES
            ('00000000-0000-4000-8000-000000000122','00000000-0000-4000-8000-000000000124','00000000-0000-4000-8000-000000000111','owner'),
            ('00000000-0000-4000-8000-000000000122','00000000-0000-4000-8000-000000000124','00000000-0000-4000-8000-000000000112','member');
          INSERT INTO public.medar_messages (company_id,conversation_id,sender_user_id,body,client_message_id)
          VALUES ('00000000-0000-4000-8000-000000000122','00000000-0000-4000-8000-000000000124','00000000-0000-4000-8000-000000000111','CI conversation message','ci-message-00000001');
          DO $verify_notifications$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM public.notifications WHERE company_id='00000000-0000-4000-8000-000000000122' AND user_id='00000000-0000-4000-8000-000000000112' AND title='وظیفهٔ جدید به شما واگذار شد' AND href='/app/home') THEN
              RAISE EXCEPTION 'Assigned task did not create an in-app notification';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM public.notifications WHERE company_id='00000000-0000-4000-8000-000000000122' AND user_id='00000000-0000-4000-8000-000000000112' AND title='پیام کاری جدید' AND href='/app/connect') THEN
              RAISE EXCEPTION 'Conversation message did not notify its other participant';
            END IF;
            IF EXISTS (SELECT 1 FROM public.notifications WHERE company_id='00000000-0000-4000-8000-000000000122' AND user_id='00000000-0000-4000-8000-000000000111') THEN
              RAISE EXCEPTION 'Message sender was incorrectly notified about their own message';
            END IF;
          END $verify_notifications$;
          ROLLBACK;
          SQL
          echo "Task assignment and conversation participant notification triggers passed."
      - name: Exercise the exact failed-login upsert SQL on PostgreSQL
        env:
          PGPASSWORD: medar_test_password
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const source = await readFile('worker/index.ts', 'utf8');
          const match = source.match(/export const FAILED_LOGIN_UPSERT_SQL = \`([\s\S]*?)\`;/);
          if (!match) throw new Error('Failed to extract FAILED_LOGIN_UPSERT_SQL from worker/index.ts');
          const statement = match[1].trim();
          if (!statement.includes('AS rate_limit') || statement.includes('public.medar_rate_limits.window_started_at')) {
            throw new Error('Failed-login upsert must use an unambiguous INSERT alias.');
          }
          const key = 'f'.repeat(64);
          const sql = [
            'PREPARE medar_failed_login(text) AS ' + statement + ';',
            "EXECUTE medar_failed_login('" + key + "');",
            "EXECUTE medar_failed_login('" + key + "');",
            "DO $rate_limit_test$ DECLARE observed integer; BEGIN " +
              "SELECT attempts INTO observed FROM public.medar_rate_limits WHERE key_hash = '" + key + "'; " +
              "IF observed IS DISTINCT FROM 2 THEN RAISE EXCEPTION 'expected two failed attempts, got %', observed; END IF; " +
            'END $rate_limit_test$;',
            "DELETE FROM public.medar_rate_limits WHERE key_hash = '" + key + "';",
            'DEALLOCATE medar_failed_login;'
          ].join('\n');
          await writeFile(process.env.RUNNER_TEMP + '/medar-failed-login-upsert.sql', sql);
          NODE
          psql -h 127.0.0.1 -U postgres -d medar_test -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/medar-failed-login-upsert.sql"
          echo "The exact failed-login rate-limit SQL executed twice successfully; the stored counter incremented to 2."
      - name: Exercise concurrent stock deductions and purchase-order receipt lifecycle
        env:
          PGPASSWORD: medar_test_password
        shell: bash
        run: |
          set -euo pipefail
          company_id="00000000-0000-4000-8000-000000000022"
          actor_id="00000000-0000-4000-8000-000000000011"
          product_id="00000000-0000-4000-8000-000000000033"
          supplier_id="00000000-0000-4000-8000-000000000044"
          psql -h 127.0.0.1 -U postgres -d medar_test -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.companies (id,name) VALUES
            ('00000000-0000-4000-8000-000000000022','CI procurement lifecycle company');
          INSERT INTO public.medar_users (id,username,username_normalized,phone_e164,display_name,password_hash) VALUES
            ('00000000-0000-4000-8000-000000000011','ci.inventory','ci.inventory','+989190000011','CI procurement owner','not-a-login-hash');
          INSERT INTO public.memberships (company_id,user_id,role,active,created_by) VALUES
            ('00000000-0000-4000-8000-000000000022','00000000-0000-4000-8000-000000000011','owner',true,'00000000-0000-4000-8000-000000000011');
          INSERT INTO public.products (id,company_id,sku,name,kind,unit) VALUES
            ('00000000-0000-4000-8000-000000000033','00000000-0000-4000-8000-000000000022','CI-STOCK-LOCK','CI stock and purchase-order probe','other','unit');
          INSERT INTO public.suppliers (id,company_id,name) VALUES
            ('00000000-0000-4000-8000-000000000044','00000000-0000-4000-8000-000000000022','CI Purchase Supplier');
          INSERT INTO public.inventory_movements (company_id,product_id,movement_type,quantity,reference_code,note,recorded_by) VALUES
            ('00000000-0000-4000-8000-000000000022','00000000-0000-4000-8000-000000000033','adjustment_in',10,'ci-seed-stock-lock','CI stock lock seed','00000000-0000-4000-8000-000000000011');
          CREATE FUNCTION public.ci_pause_inventory_race() RETURNS trigger LANGUAGE plpgsql AS $$
          BEGIN
            IF NEW.reference_code LIKE 'ci-race-%' THEN PERFORM pg_sleep(0.75); END IF;
            RETURN NEW;
          END $$;
          CREATE TRIGGER ci_pause_inventory_race BEFORE INSERT ON public.inventory_movements
            FOR EACH ROW EXECUTE FUNCTION public.ci_pause_inventory_race();
          SQL
          set +e
          psql -h 127.0.0.1 -U postgres -d medar_test -v ON_ERROR_STOP=1 -c "select public.medar_record_inventory_movement('$actor_id','$company_id','$product_id','adjustment_out',7,NULL,NULL,NULL,NULL,'ci-race-a','CI concurrency probe')" > "$RUNNER_TEMP/stock-race-a.log" 2>&1 &
          first_pid=$!
          psql -h 127.0.0.1 -U postgres -d medar_test -v ON_ERROR_STOP=1 -c "select public.medar_record_inventory_movement('$actor_id','$company_id','$product_id','adjustment_out',7,NULL,NULL,NULL,NULL,'ci-race-b','CI concurrency probe')" > "$RUNNER_TEMP/stock-race-b.log" 2>&1 &
          second_pid=$!
          wait "$first_pid"; first_status=$?
          wait "$second_pid"; second_status=$?
          set -e
          successes=0
          [[ "$first_status" -eq 0 ]] && successes=$((successes+1))
          [[ "$second_status" -eq 0 ]] && successes=$((successes+1))
          if [[ "$successes" -ne 1 ]]; then
            cat "$RUNNER_TEMP/stock-race-a.log" "$RUNNER_TEMP/stock-race-b.log"
            echo "Expected exactly one simultaneous quantity-7 deduction against stock 10 to succeed; succeeded: $successes."
            exit 1
          fi
          stock_ok="$(psql -h 127.0.0.1 -U postgres -d medar_test -v ON_ERROR_STOP=1 -Atqc "select (quantity_on_hand = 3)::text from public.inventory_balances where company_id='$company_id' and product_id='$product_id'")"
          if [[ "$stock_ok" != "true" ]]; then
            cat "$RUNNER_TEMP/stock-race-a.log" "$RUNNER_TEMP/stock-race-b.log"
            echo "Concurrent deduction left an invalid stock balance."
            exit 1
          fi

          psql -h 127.0.0.1 -U postgres -d medar_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $ci$
          DECLARE
            v_actor_id uuid := '00000000-0000-4000-8000-000000000011';
            v_company_id uuid := '00000000-0000-4000-8000-000000000022';
            v_product_id uuid := '00000000-0000-4000-8000-000000000033';
            v_supplier_id uuid := '00000000-0000-4000-8000-000000000044';
            po_id uuid;
            line_id uuid;
            status_value text;
            qty_value numeric;
          BEGIN
            po_id := public.medar_create_purchase_order(
              v_actor_id,v_company_id,v_supplier_id,'CI-PO-0001',
              jsonb_build_array(jsonb_build_object('product_id',v_product_id::text,'quantity',10,'unit_cost',125)),
              current_date+7,'CI purchase-order end-to-end test'
            );
            PERFORM public.medar_approve_purchase_order(v_actor_id,v_company_id,po_id);
            SELECT id INTO line_id FROM public.purchase_order_items
              WHERE company_id=v_company_id AND purchase_order_id=po_id;
            PERFORM public.medar_receive_purchase_order(
              v_actor_id,v_company_id,po_id,
              jsonb_build_array(jsonb_build_object('purchase_order_item_id',line_id::text,'quantity_received',4)),
              'CI-RECEIPT-PARTIAL','CI partial receipt'
            );
            SELECT po.status,poi.received_quantity INTO status_value,qty_value
              FROM public.purchase_orders po JOIN public.purchase_order_items poi ON poi.purchase_order_id=po.id
              WHERE po.id=po_id;
            IF status_value<>'partially_received' OR qty_value<>4 THEN
              RAISE EXCEPTION 'Partial receipt state incorrect: status %, quantity %',status_value,qty_value;
            END IF;
            PERFORM public.medar_receive_purchase_order(
              v_actor_id,v_company_id,po_id,
              jsonb_build_array(jsonb_build_object('purchase_order_item_id',line_id::text,'quantity_received',6)),
              'CI-RECEIPT-FINAL','CI final receipt'
            );
            SELECT po.status,poi.received_quantity INTO status_value,qty_value
              FROM public.purchase_orders po JOIN public.purchase_order_items poi ON poi.purchase_order_id=po.id
              WHERE po.id=po_id;
            IF status_value<>'received' OR qty_value<>10 THEN
              RAISE EXCEPTION 'Final receipt state incorrect: status %, quantity %',status_value,qty_value;
            END IF;
            BEGIN
              PERFORM public.medar_receive_purchase_order(
                v_actor_id,v_company_id,po_id,
                jsonb_build_array(jsonb_build_object('purchase_order_item_id',line_id::text,'quantity_received',1)),
                'CI-RECEIPT-OVERFLOW','This must be rejected'
              );
              RAISE EXCEPTION 'Over-receipt was incorrectly accepted';
            EXCEPTION WHEN OTHERS THEN
              IF SQLERRM='Over-receipt was incorrectly accepted' THEN RAISE; END IF;
            END;
            SELECT quantity_on_hand INTO qty_value FROM public.inventory_balances
              WHERE company_id=v_company_id AND product_id=v_product_id;
            IF qty_value<>13 THEN RAISE EXCEPTION 'Expected stock 13 after one deduction and ten received units; got %',qty_value; END IF;
          END $ci$;
          SQL

          psql -h 127.0.0.1 -U postgres -d medar_test -v ON_ERROR_STOP=1 <<'SQL'
          DROP TRIGGER ci_pause_inventory_race ON public.inventory_movements;
          DROP FUNCTION public.ci_pause_inventory_race();
          DELETE FROM public.audit_events WHERE company_id='00000000-0000-4000-8000-000000000022';
          DELETE FROM public.purchase_orders WHERE company_id='00000000-0000-4000-8000-000000000022';
          DELETE FROM public.inventory_movements WHERE company_id='00000000-0000-4000-8000-000000000022';
          DELETE FROM public.products WHERE id='00000000-0000-4000-8000-000000000033';
          DELETE FROM public.suppliers WHERE id='00000000-0000-4000-8000-000000000044';
          DELETE FROM public.memberships WHERE company_id='00000000-0000-4000-8000-000000000022';
          DELETE FROM public.medar_users WHERE id='00000000-0000-4000-8000-000000000011';
          DELETE FROM public.companies WHERE id='00000000-0000-4000-8000-000000000022';
          SQL
          echo "Concurrent deductions, purchase-order approval, partial/final receipt, stock ledger updates, and over-receipt rejection all passed."
      - name: Verify partner settlement lifecycle, role restrictions, and bank ledger invariants
