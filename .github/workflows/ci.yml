name: Simorgh CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: medar_test_password
          POSTGRES_DB: medar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d medar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - name: Validate the complete migration chain on a clean PostgreSQL 16 database
        env:
          PGPASSWORD: medar_test_password
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h 127.0.0.1 -U postgres -d medar_test -v ON_ERROR_STOP=1 -c "create table if not exists public.medar_schema_migrations (version text primary key, checksum text not null, applied_at timestamptz not null default now())"
          for migration in \
            worker/migrations/0001_foundation.sql \
            worker/migrations/0002_identity_foreign_keys.sql \
            worker/migrations/0003_operational_schema.sql \
            worker/migrations/0004_operational_integrity.sql \
            worker/migrations/0005_partner_settlement_functions.sql \
            worker/migrations/0006_core_data_api.sql \
            worker/migrations/0007_existing_medar_schema_compat.sql \
            worker/migrations/0008_operational_task_actions.sql \
            worker/migrations/0009_inventory_movement_concurrency_lock.sql \
            worker/migrations/0010_purchase_order_lifecycle.sql   \
            worker/migrations/0011_username_password_only.sql \
            worker/migrations/0012_client_presence.sql worker/migrations/0013_ai_assistant_and_contacts.sql worker/migrations/0014_contact_intelligence.sql worker/migrations/0015_ai_action_approval_ledger.sql worker/migrations/0016_membership_module_permissions.sql worker/migrations/0017_delivery_video_evidence.sql worker/migrations/0018_bank_reconciliation_ledger.sql worker/migrations/0019_daily_briefing_notifications.sql worker/migrations/0020_operational_event_exception_ledger.sql worker/migrations/0021_medar_connect_messaging.sql worker/migrations/0022_web_push_delivery_queue.sql worker/migrations/0023_operational_event_hooks.sql worker/migrations/0024_connect_task_notifications.sql worker/migrations/0025_supplier_location_details.sql worker/migrations/0026_task_status_notifications.sql; do
            echo "Applying $migration"
            psql -h 127.0.0.1 -U postgres -d medar_test -v ON_ERROR_STOP=1 -1 -f "$migration"
            version="$(basename "$migration")"
            checksum="$(sha256sum "$migration" | awk '{print $1}')"
            psql -h 127.0.0.1 -U postgres -d medar_test -v ON_ERROR_STOP=1 -c "insert into public.medar_schema_migrations(version,checksum) values ('$version','$checksum') on conflict(version) do update set checksum=excluded.checksum"
          done
          psql -h 127.0.0.1 -U postgres -d medar_test -v ON_ERROR_STOP=1 -Atqc "
            select (
              to_regclass('public.medar_users') is not null and
              to_regclass('public.medar_client_presence') is not null and
              to_regclass('public.medar_ai_provider_configs') is not null and
              to_regclass('public.medar_ai_usage_log') is not null and
              to_regclass('public.medar_ai_action_runs') is not null and
              to_regprocedure('public.medar_execute_ai_create_task(uuid,uuid,uuid)') is not null and
              to_regclass('public.medar_membership_module_permissions') is not null and
              to_regclass('public.medar_bank_accounts') is not null and
              to_regclass('public.medar_bank_transactions') is not null and
              to_regclass('public.notifications') is not null and
              (select count(*) from information_schema.columns where table_schema='public' and table_name='notifications' and column_name='dedupe_key') = 1 and
              exists (select 1 from pg_indexes where schemaname='public' and indexname='notifications_company_user_dedupe_key_uq') and
              exists (select 1 from public.medar_schema_migrations where version='0019_daily_briefing_notifications.sql') and
              to_regclass('public.medar_operational_events') is not null and
              to_regclass('public.medar_exception_cases') is not null and
              to_regclass('public.medar_conversations') is not null and
              to_regclass('public.medar_conversation_participants') is not null and
              to_regclass('public.medar_messages') is not null and
              to_regclass('public.medar_push_subscriptions') is not null and
              to_regclass('public.medar_notification_outbox') is not null and
              to_regprocedure('public.medar_enqueue_notification_push()') is not null and
              to_regprocedure('public.medar_emit_operational_event()') is not null and
              exists (select 1 from pg_trigger where tgname='medar_emit_operational_event' and not tgisinternal) and
              exists (select 1 from public.medar_schema_migrations where version='0023_operational_event_hooks.sql') and
              to_regprocedure('public.medar_notify_task_assignee()') is not null and
              to_regprocedure('public.medar_notify_conversation_participants()') is not null and
              exists (select 1 from pg_trigger where tgname='medar_notify_task_assignee' and not tgisinternal) and
              exists (select 1 from pg_trigger where tgname='medar_notify_conversation_participants' and not tgisinternal) and
              exists (select 1 from public.medar_schema_migrations where version='0024_connect_task_notifications.sql') and
              exists (select 1 from public.medar_schema_migrations where version='0025_supplier_location_details.sql') and
              to_regprocedure('public.medar_notify_task_status_change()') is not null and
              (select count(*) from information_schema.columns where table_schema='public' and table_name='suppliers' and column_name in ('province','address','latitude','longitude')) = 4 and
              to_regprocedure('public.medar_check_membership_permission_company()') is not null and
              (select count(*) from information_schema.columns where table_schema='public' and table_name in ('customers','suppliers') and column_name in ('email','organization_name','contact_notes','contact_tags','contact_source')) = 10 and
              (select is_nullable = 'YES' from information_schema.columns where table_schema='public' and table_name='medar_users' and column_name='phone_e164') and
              (select is_nullable = 'YES' from information_schema.columns where table_schema='public' and table_name='profiles' and column_name='phone') and
              to_regclass('public.medar_sessions') is not null and
              to_regclass('public.companies') is not null and
              to_regclass('public.memberships') is not null and
              to_regclass('public.orders') is not null and
              to_regclass('public.farm_sites') is not null and
              to_regclass('public.partner_settlement_periods') is not null and
              to_regclass('public.inventory_balances') is not null and
              to_regclass('public.company_invites') is not null and
              to_regprocedure('public.medar_allocate_order_item(uuid,uuid,uuid,uuid)') is not null and
              to_regprocedure('public.medar_start_operational_task(uuid,uuid)') is not null and
              to_regprocedure('public.medar_create_partner_settlement_period(uuid,uuid,date,date)') is not null and
              position('pg_advisory_xact_lock' in pg_get_functiondef(to_regprocedure('public.medar_record_inventory_movement(uuid,uuid,uuid,text,numeric,numeric,uuid,uuid,uuid,text,text)'))) > 0 and
              to_regclass('public.purchase_orders') is not null and
              to_regclass('public.purchase_order_items') is not null and
              to_regprocedure('public.medar_create_purchase_order(uuid,uuid,uuid,text,jsonb,date,text)') is not null and
              to_regprocedure('public.medar_approve_purchase_order(uuid,uuid,uuid)') is not null and
              to_regprocedure('public.medar_receive_purchase_order(uuid,uuid,uuid,jsonb,text,text)') is not null
            )" | grep -qx t
      - name: Verify task and conversation notifications on PostgreSQL
