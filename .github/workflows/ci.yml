      - name: Verify PostgreSQL backup and restore on a disposable CI database
        env:
          PGPASSWORD: medar_test_password
        shell: bash
        run: |
          set -euo pipefail
          restore_db="medar_restore_test"
          dump_file="$RUNNER_TEMP/medar-ci-backup.dump"
          cleanup_restore() {
            dropdb -h 127.0.0.1 -U postgres --if-exists "$restore_db" >/dev/null 2>&1 || true
            psql -h 127.0.0.1 -U postgres -d medar_test -v ON_ERROR_STOP=1 -c "DROP TABLE IF EXISTS public.ci_backup_probe" >/dev/null 2>&1 || true
            rm -f "$dump_file"
          }
          trap cleanup_restore EXIT
          psql -h 127.0.0.1 -U postgres -d medar_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE public.ci_backup_probe (id integer PRIMARY KEY, marker text NOT NULL);
          INSERT INTO public.ci_backup_probe(id,marker) VALUES (1,'medar-backup-restore-roundtrip');
          SQL
          pg_dump -h 127.0.0.1 -U postgres -d medar_test --format=custom --no-owner --no-acl --file="$dump_file"
          createdb -h 127.0.0.1 -U postgres "$restore_db"
          pg_restore -h 127.0.0.1 -U postgres -d "$restore_db" --no-owner --no-acl "$dump_file"
          restored_marker="$(psql -h 127.0.0.1 -U postgres -d "$restore_db" -v ON_ERROR_STOP=1 -Atqc "SELECT marker FROM public.ci_backup_probe WHERE id=1")"
          restored_migrations="$(psql -h 127.0.0.1 -U postgres -d "$restore_db" -v ON_ERROR_STOP=1 -Atqc "SELECT count(*) FROM public.medar_schema_migrations")"
          test "$restored_marker" = "medar-backup-restore-roundtrip"
          test "$restored_migrations" = "26"
          echo "PostgreSQL custom-format backup restored successfully with all 26 migration records and the fixture marker."
      - name: Summarize all dependency advisories
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const items = Object.entries(report.vulnerabilities || {}).map(([name, v]) => ({
            name, severity: v.severity, direct: v.isDirect, range: v.range,
            fixAvailable: v.fixAvailable,
            via: (v.via || []).map(x => typeof x === 'string' ? x : x.title)
          }));
          console.log(JSON.stringify({ summary: report.metadata?.vulnerabilities, items }, null, 2));
          NODE
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Build test bundle with auth UI enabled
        run: npm run build:pages
        env:
          VITE_ENABLE_AUTH_UI: 'true'
      - name: Install Chromium for responsive browser simulation
        run: npx playwright install --with-deps chromium
      - name: Run desktop, mobile, auth and operational browser checks
        run: npm run test:e2e
      - name: Upload browser reports and failure artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: medar-browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Build the same-origin Cloudflare Worker frontend with the public demo
        run: npm run build
        env:
          VITE_ENABLE_AUTH_UI: 'false'
      - name: Verify Worker build has the public demo and premium operations styles
        shell: bash
        run: |
          grep -q 'id="root"' dist/index.html
          if grep -Eq '(src|href)="/simorgh/' dist/index.html; then
            echo "Cloudflare Worker root build must use domain-root asset URLs, not the GitHub Pages subpath."
            cat dist/index.html
            exit 1
          fi
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.css' -print -quit)"
          grep -Rqs --include='*.js' 'demo-workspace' dist/assets
          grep -Rqs --include='*.js' 'دموی قابل ارائه' dist/assets
          grep -Rqs --include='*.js' 'عملیات، در یک نگاه.' dist/assets
          grep -Rqs --include='*.css' 'demo-workspace' dist/assets
          grep -Rqs --include='*.css' 'demo-preview-notice' dist/assets
          echo "Worker frontend build includes the public read-only demo and root-relative assets."
      - name: Build the Pages production bundle
        run: npm run build:pages
        env:
          VITE_ENABLE_AUTH_UI: 'false'
      - name: Verify built assets use the GitHub Pages base path
        shell: bash
        run: |
          if ! grep -Eq 'src="/simorgh/assets/[^"]+\.js"' dist/index.html; then
            echo "The production entry does not reference a JavaScript bundle under /simorgh/assets/."
            cat dist/index.html
            exit 1
          fi
          if grep -Eq '(src|href)="/(assets|src)/' dist/index.html; then
            echo "An app asset points to the domain root instead of the /simorgh/ Pages subpath."
            cat dist/index.html
            exit 1
          fi
