name: Simorgh CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: medar_test_password
          POSTGRES_DB: medar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d medar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - name: Validate the complete migration chain on a clean PostgreSQL 16 database
        env:
          PGPASSWORD: medar_test_password
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          for migration in \
            worker/migrations/0001_foundation.sql \
            worker/migrations/0002_identity_foreign_keys.sql \
            worker/migrations/0003_operational_schema.sql \
            worker/migrations/0004_operational_integrity.sql \
            worker/migrations/0005_partner_settlement_functions.sql \
            worker/migrations/0006_core_data_api.sql \
            worker/migrations/0007_existing_medar_schema_compat.sql \
            worker/migrations/0008_operational_task_actions.sql \
            worker/migrations/0009_inventory_movement_concurrency_lock.sql; do
            echo "Applying $migration"
            psql -h 127.0.0.1 -U postgres -d medar_test -v ON_ERROR_STOP=1 -1 -f "$migration"
          done
          psql -h 127.0.0.1 -U postgres -d medar_test -v ON_ERROR_STOP=1 -Atqc "
            select (
              to_regclass('public.medar_users') is not null and
              to_regclass('public.medar_sessions') is not null and
              to_regclass('public.companies') is not null and
              to_regclass('public.memberships') is not null and
              to_regclass('public.orders') is not null and
              to_regclass('public.farm_sites') is not null and
              to_regclass('public.partner_settlement_periods') is not null and
              to_regclass('public.inventory_balances') is not null and
              to_regclass('public.company_invites') is not null and
              to_regprocedure('public.medar_allocate_order_item(uuid,uuid,uuid,uuid)') is not null and
              to_regprocedure('public.medar_start_operational_task(uuid,uuid)') is not null and
              to_regprocedure('public.medar_create_partner_settlement_period(uuid,uuid,date,date)') is not null and
              position('pg_advisory_xact_lock' in pg_get_functiondef(to_regprocedure('public.medar_record_inventory_movement(uuid,uuid,uuid,text,numeric,numeric,uuid,uuid,uuid,text,text)'))) > 0
            )" | grep -qx t
      - name: Exercise concurrent inventory deductions on PostgreSQL
        env:
          PGPASSWORD: medar_test_password
        shell: bash
        run: |
          set -euo pipefail
          company_id="00000000-0000-4000-8000-000000000022"
          actor_id="00000000-0000-4000-8000-000000000011"
          product_id="00000000-0000-4000-8000-000000000033"
          psql -h 127.0.0.1 -U postgres -d medar_test -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.companies (id,name) VALUES
            ('00000000-0000-4000-8000-000000000022','CI inventory concurrency company');
          INSERT INTO public.medar_users (id,username,username_normalized,phone_e164,display_name,password_hash) VALUES
            ('00000000-0000-4000-8000-000000000011','ci.inventory','ci.inventory','+989190000011','CI inventory owner','not-a-login-hash');
          INSERT INTO public.memberships (company_id,user_id,role,active,created_by) VALUES
            ('00000000-0000-4000-8000-000000000022','00000000-0000-4000-8000-000000000011','owner',true,'00000000-0000-4000-8000-000000000011');
          INSERT INTO public.products (id,company_id,sku,name,kind,unit) VALUES
            ('00000000-0000-4000-8000-000000000033','00000000-0000-4000-8000-000000000022','CI-STOCK-LOCK','CI stock lock probe','other','unit');
          INSERT INTO public.inventory_movements (company_id,product_id,movement_type,quantity,reference_code,note,recorded_by) VALUES
            ('00000000-0000-4000-8000-000000000022','00000000-0000-4000-8000-000000000033','adjustment_in',10,'ci-seed-stock-lock','CI stock lock seed','00000000-0000-4000-8000-000000000011');
          CREATE FUNCTION public.ci_pause_inventory_race() RETURNS trigger LANGUAGE plpgsql AS $$
          BEGIN
            IF NEW.reference_code LIKE 'ci-race-%' THEN PERFORM pg_sleep(0.75); END IF;
            RETURN NEW;
          END $$;
          CREATE TRIGGER ci_pause_inventory_race BEFORE INSERT ON public.inventory_movements
            FOR EACH ROW EXECUTE FUNCTION public.ci_pause_inventory_race();
          SQL
          set +e
          psql -h 127.0.0.1 -U postgres -d medar_test -v ON_ERROR_STOP=1 -c "select public.medar_record_inventory_movement('$actor_id','$company_id','$product_id','adjustment_out',7,NULL,NULL,NULL,NULL,'ci-race-a','CI concurrency probe')" > "$RUNNER_TEMP/stock-race-a.log" 2>&1 &
          first_pid=$!
          psql -h 127.0.0.1 -U postgres -d medar_test -v ON_ERROR_STOP=1 -c "select public.medar_record_inventory_movement('$actor_id','$company_id','$product_id','adjustment_out',7,NULL,NULL,NULL,NULL,'ci-race-b','CI concurrency probe')" > "$RUNNER_TEMP/stock-race-b.log" 2>&1 &
          second_pid=$!
          wait "$first_pid"; first_status=$?
          wait "$second_pid"; second_status=$?
          set -e
          successes=0
          [[ "$first_status" -eq 0 ]] && successes=$((successes+1))
          [[ "$second_status" -eq 0 ]] && successes=$((successes+1))
          if [[ "$successes" -ne 1 ]]; then
            cat "$RUNNER_TEMP/stock-race-a.log" "$RUNNER_TEMP/stock-race-b.log"
            echo "Expected exactly one of two simultaneous quantity-7 deductions against stock 10 to succeed; succeeded: $successes."
            exit 1
          fi
          stock_ok="$(psql -h 127.0.0.1 -U postgres -d medar_test -v ON_ERROR_STOP=1 -Atqc "select (quantity_on_hand = 3)::text from public.inventory_balances where company_id='$company_id' and product_id='$product_id'")"
          if [[ "$stock_ok" != "true" ]]; then
            psql -h 127.0.0.1 -U postgres -d medar_test -c "select movement_type,quantity,reference_code from public.inventory_movements where company_id='$company_id' and product_id='$product_id' order by created_at"
            echo "Concurrent deduction left an invalid stock balance."
            exit 1
          fi
          psql -h 127.0.0.1 -U postgres -d medar_test -v ON_ERROR_STOP=1 <<'SQL'
          DROP TRIGGER ci_pause_inventory_race ON public.inventory_movements;
          DROP FUNCTION public.ci_pause_inventory_race();
          DELETE FROM public.audit_events WHERE company_id='00000000-0000-4000-8000-000000000022';
          DELETE FROM public.inventory_movements WHERE company_id='00000000-0000-4000-8000-000000000022';
          DELETE FROM public.products WHERE id='00000000-0000-4000-8000-000000000033';
          DELETE FROM public.memberships WHERE company_id='00000000-0000-4000-8000-000000000022';
          DELETE FROM public.medar_users WHERE id='00000000-0000-4000-8000-000000000011';
          DELETE FROM public.companies WHERE id='00000000-0000-4000-8000-000000000022';
          SQL
          echo "Concurrent stock deductions were serialized; exactly one deduction succeeded and stock remained nonnegative."
      - name: Summarize all dependency advisories
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const items = Object.entries(report.vulnerabilities || {}).map(([name, v]) => ({
            name, severity: v.severity, direct: v.isDirect, range: v.range,
            fixAvailable: v.fixAvailable,
            via: (v.via || []).map(x => typeof x === 'string' ? x : x.title)
          }));
          console.log(JSON.stringify({ summary: report.metadata?.vulnerabilities, items }, null, 2));
          NODE
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Build test bundle with auth UI enabled
        run: npm run build:pages
        env:
          VITE_ENABLE_AUTH_UI: 'true'
      - name: Install Chromium for responsive browser simulation
        run: npx playwright install --with-deps chromium
      - name: Run desktop, mobile, auth and operational browser checks
        run: npm run test:e2e
      - name: Upload browser reports and failure artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: medar-browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Build the same-origin Cloudflare Worker frontend with secure sign-in
        run: npm run build
        env:
          VITE_ENABLE_AUTH_UI: 'true'
      - name: Verify Worker build has auth UI and premium operations styles
        shell: bash
        run: |
          grep -q 'id="root"' dist/index.html
          if grep -Eq '(src|href)="/simorgh/' dist/index.html; then
            echo "Cloudflare Worker root build must use domain-root asset URLs, not the GitHub Pages subpath."
            cat dist/index.html
            exit 1
          fi
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.css' -print -quit)"
          grep -Rqs --include='*.js' 'ورود به مدار' dist/assets
          grep -Rqs --include='*.js' 'simorgh-signin-layer' dist/assets
          grep -Rqs --include='*.css' 'tower-quick-grid' dist/assets
          grep -Rqs --include='*.css' 'medar-glass' dist/assets
          echo "Worker frontend build includes sign-in, the command-center polish, and root-relative assets."
      - name: Build the Pages production bundle
        run: npm run build:pages
        env:
          VITE_ENABLE_AUTH_UI: 'false'
      - name: Verify built assets use the GitHub Pages base path
        shell: bash
        run: |
          if ! grep -Eq 'src="/simorgh/assets/[^"]+\.js"' dist/index.html; then
            echo "The production entry does not reference a JavaScript bundle under /simorgh/assets/."
            cat dist/index.html
            exit 1
          fi
          if grep -Eq '(src|href)="/(assets|src)/' dist/index.html; then
            echo "An app asset points to the domain root instead of the /simorgh/ Pages subpath."
            cat dist/index.html
            exit 1
          fi
