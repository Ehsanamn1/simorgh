name: Simorgh CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - name: Summarize all dependency advisories
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const items = Object.entries(report.vulnerabilities || {}).map(([name, v]) => ({
            name, severity: v.severity, direct: v.isDirect, range: v.range,
            fixAvailable: v.fixAvailable,
            via: (v.via || []).map(x => typeof x === 'string' ? x : x.title)
          }));
          console.log(JSON.stringify({ summary: report.metadata?.vulnerabilities, items }, null, 2));
          NODE
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Build the same base path used by GitHub Pages
        run: npm run build:pages
        env:
          VITE_SUPABASE_URL: https://aoxerjimfiwusidaparx.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_oTgVCJWw9BfK-kFUxTcaMQ_aeAUWXC5
      - name: Install Chromium for responsive browser simulation
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser checks
        run: npm run test:e2e
      - name: Upload browser test report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: simorgh-browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
