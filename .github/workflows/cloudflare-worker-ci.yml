name: Medar Cloudflare Worker CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_NEON_AUTH_URL: https://ep-muddy-dew-baqc0y3p.neonauth.c-8.eu-central-1.aws.neon.tech/neondb/auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Typecheck
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body "### Medar typecheck failure\n\n\\`\\`\\`text\n$(cat "$RUNNER_TEMP/typecheck.log")\n\\`\\`\\`" || true
            exit "$code"
          fi
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Validate Worker source
        working-directory: worker
        run: npx wrangler@4 deploy --dry-run
