name: Medar Cloudflare Worker CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_NEON_AUTH_URL: https://ep-wild-mountain-baaweix2.neonauth.c-8.eu-central-1.aws.neon.tech/neondb/auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Validate Worker source
        working-directory: worker
        run: npx wrangler@4 deploy --dry-run
