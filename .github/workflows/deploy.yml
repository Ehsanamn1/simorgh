name: Deploy Simorgh to Cloudflare Pages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the current deployment target
        shell: bash
        run: |
          echo "The Medar sign-in uses same-origin HttpOnly session cookies. Do not deploy it as a static Pages bundle."
          echo "Use .github/workflows/cloudflare-worker.yml to deploy the app assets and API together on Cloudflare Workers."
          exit 1
