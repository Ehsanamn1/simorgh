name: Simorgh iOS Simulator App

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator:
    name: Build iOS simulator app
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JavaScript dependencies
        run: npm install

      - name: Require a Worker API URL before publishing mobile artifacts
        if: github.event_name != 'pull_request'
        env:
          MEDAR_OPS_API_BASE_URL: ${{ vars.MEDAR_OPS_API_BASE_URL || 'https://medar-ops.dengxiao445.workers.dev' }}
        run: |
          if [[ -z "$MEDAR_OPS_API_BASE_URL" || "$MEDAR_OPS_API_BASE_URL" != https://* ]]; then
            echo "Set MEDAR_OPS_API_BASE_URL to the authenticated medar-ops Worker before building an operational mobile app."
            exit 1
          fi

      - name: Build application assets
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.MEDAR_OPS_API_BASE_URL || 'https://medar-ops.dengxiao445.workers.dev' }}
          VITE_ENABLE_AUTH_UI: 'true'
          VITE_APP_VERSION: ${{ github.sha }}

      - name: Verify the mobile bundle has the authenticated workspace and configured API endpoint
        shell: bash
        env:
          MEDAR_OPS_API_BASE_URL: ${{ vars.MEDAR_OPS_API_BASE_URL || 'https://medar-ops.dengxiao445.workers.dev' }}
        run: |
          test -f dist/index.html
          grep -Rqs --include='*.js' 'simorgh-signin-layer' dist/assets
          grep -Rqs --include='*.js' 'ورود به مدار' dist/assets
          grep -Rqs --include='*.js' 'ساخت حساب و فضای کاری' dist/assets
          grep -Rqs --include='*.js' -F "$MEDAR_OPS_API_BASE_URL" dist/assets
          grep -Rqs --include='*.js' 'VITE_APP_VERSION' dist/assets || grep -Rqs --include='*.js' '0.1.0' dist/assets
          grep -Rqs --include='*.css' 'simorgh-signin-layer' dist/assets
          echo "iOS bundle includes the guarded app and the same authenticated Medar API used by web."


      - name: Generate iOS project
        run: npx cap add ios

      - name: Synchronize native assets
        run: npx cap sync ios

      - name: Configure foreground location permission text
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string Simorgh uses your location only when you explicitly tap Send GPS for an assigned shipment." "$PLIST" || /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription Simorgh uses your location only when you explicitly tap Send GPS for an assigned shipment." "$PLIST"

      - name: Build unsigned iOS Simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          cd ios/build/Build/Products/Debug-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/Simorgh-iOS-Simulator.zip" App.app

      - name: Upload simulator app artifact
        uses: actions/upload-artifact@v4
        with:
          name: simorgh-ios-simulator-app
          path: Simorgh-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
